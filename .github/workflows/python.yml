name: Python checks

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner labels as JSON, e.g. '"ubuntu-latest"' or '["self-hosted","linux"]'
        type: string
        default: '"ubuntu-latest"'
      working-directory:
        description: The project's directory, relative to the repo root
        type: string
        default: .
      source-dirs:
        description: Shipped source directories, space-separated, for pyright, vulture and coverage
        type: string
        default: src
      license-exceptions:
        description: The repo's packages exempt from the license check, one name per line; may be absent
        type: string
        default: .github/checks/license-exceptions.txt

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 40
    env:
      RG: ${{ github.workspace }}/repo-guards/ci-checks
      BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.merge_group.base_sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || format('origin/{0}', github.event.repository.default_branch) }}
      SOURCE_DIRS: ${{ inputs.source-dirs }}
      UV_NO_BUILD: "1"
    defaults:
      run:
        shell: bash
        working-directory: repo/${{ inputs.working-directory }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 0
          persist-credentials: false
      # job.workflow_* is this file's repo and commit; the toJSON round trip hides it from actionlint 1.7.12, which lacks it.
      - name: Check out repo-guards at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          path: repo-guards
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      - name: Install the shared dev group
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/tools"
          uv pip install --python "$RUNNER_TEMP/tools" --group "$RG/python/pyproject.toml:dev" pip-audit==2.10.1 pip-licenses==5.5.5
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - name: Install diff-cover
        working-directory: ${{ runner.temp }}
        run: |
          uv venv --python 3.12 coverage-venv
          uv pip install --python coverage-venv/bin/python --require-hashes -r "$RG/coverage/requirements.txt"
      - name: Install the project from wheels only
        run: uv sync --locked
      - name: Format
        if: ${{ !cancelled() }}
        run: ruff format --check --config "$RG/python/pyproject.toml" .
      - name: Lint
        if: ${{ !cancelled() }}
        run: ruff check --config "$RG/python/pyproject.toml" .
      - name: Comment budget
        if: ${{ !cancelled() }}
        run: python3 "$RG/python/comment-budget/comment_budget.py" --base "$BASE_REF" --config "$RG/python/comment-budget.toml"
      - name: Type check
        if: ${{ !cancelled() }}
        run: |
          # pyright roots imports at its config's folder, so the shared settings go into a config that points at the repo.
          python3 -c 'import json, sys, tomllib, pathlib; c = tomllib.load(open(sys.argv[1], "rb"))["tool"]["pyright"]; c["extraPaths"] = [str(pathlib.Path(d).resolve()) for d in sys.argv[3:]]; pathlib.Path(sys.argv[2]).write_text(json.dumps(c))' "$RG/python/pyproject.toml" "$RUNNER_TEMP/pyrightconfig.json" $SOURCE_DIRS
          pyright --project "$RUNNER_TEMP/pyrightconfig.json" --pythonpath .venv/bin/python $SOURCE_DIRS
      - name: Dead code
        if: ${{ !cancelled() }}
        run: vulture --config "$RG/python/pyproject.toml" $SOURCE_DIRS
      - name: Unused dependencies
        if: ${{ !cancelled() }}
        run: |
          deptry=$(python3 -c 'import sys, tomllib; print(next(r for r in tomllib.load(open(sys.argv[1], "rb"))["dependency-groups"]["dev"] if r.startswith("deptry==")))' "$RG/python/pyproject.toml")
          uv run --locked --with "$deptry" deptry $SOURCE_DIRS
      - name: Vulnerabilities
        if: ${{ !cancelled() }}
        run: |
          uv export --locked --format requirements-txt --no-emit-workspace -o "$RUNNER_TEMP/requirements.txt"
          pip-audit --requirement "$RUNNER_TEMP/requirements.txt" --disable-pip --require-hashes
      - name: Licenses
        if: ${{ !cancelled() }}
        env:
          EXCEPTIONS: ${{ inputs.license-exceptions }}
        run: |
          allowed=$(python3 -c 'import sys, tomllib; c = tomllib.load(open(sys.argv[1], "rb")); print(";".join(c["allow"] + [k for k, v in c["python-classifiers"].items() if v in c["allow"]]))' "$RG/licenses.toml")
          ignore=("$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb")).get("project", {}).get("name", ""))')")
          if [[ -f "$GITHUB_WORKSPACE/repo/$EXCEPTIONS" ]]; then
            mapfile -t -O 1 ignore < <(grep -v '^[[:space:]]*$' "$GITHUB_WORKSPACE/repo/$EXCEPTIONS")
          fi
          pip-licenses --python .venv/bin/python --from mixed --allow-only "$allowed" --ignore-packages "${ignore[@]}"
      # The coverage steps run the PR's tests, so they come after every static check.
      - name: Coverage
        id: coverage
        if: ${{ !cancelled() }}
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PROJECT_DIR: ${{ inputs.working-directory }}
        run: |
          coverage=$(python3 -c 'import sys, tomllib; print(next(r for r in tomllib.load(open(sys.argv[1], "rb"))["dependency-groups"]["dev"] if r.startswith("coverage[toml]==")))' "$RG/python/pyproject.toml")
          read -ra dirs <<< "$SOURCE_DIRS"
          sources=$(IFS=,; echo "${dirs[*]}")
          measure() {
            (cd "$1" && uv sync --locked \
              && uv run --locked --with "$coverage" coverage run --rcfile "$RG/python/pyproject.toml" --source "$sources" -m pytest \
              && uv run --locked --with "$coverage" coverage xml --rcfile "$RG/python/pyproject.toml" -o "$2")
          }
          # A self-hosted runner keeps repo/.git but empties RUNNER_TEMP: drop the last job's stale registration.
          git worktree prune
          git worktree add --detach "$RUNNER_TEMP/base" "$(git merge-base "$BASE_REF" HEAD)"
          measure "$RUNNER_TEMP/base/$PROJECT_DIR" "$RUNNER_TEMP/coverage-base.xml" || echo "::warning::Tests at the merge-base failed"
          measure . "$RUNNER_TEMP/coverage-head.xml"
      - name: Coverage gate
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        run: |
          PATH="$RUNNER_TEMP/coverage-venv/bin:$PATH" python "$RG/coverage/coverage_gate.py" --config "$RG/coverage/coverage.toml" \
            --head "$RUNNER_TEMP/coverage-head.xml" --base "$RUNNER_TEMP/coverage-base.xml" --compare-branch "$BASE_REF"
      # Report only: lizard installs inside the step, and a failure anywhere leaves the job result unchanged.
      - name: CRAP report
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          if uv venv -q --clear --python 3.12 "$RUNNER_TEMP/crap-venv" \
            && uv pip install -q --python "$RUNNER_TEMP/crap-venv/bin/python" --require-hashes -r "$RG/crap/requirements.txt"; then
            "$RUNNER_TEMP/crap-venv/bin/python" "$RG/crap/crap_report.py" --coverage "$RUNNER_TEMP/coverage-head.xml"
          else
            echo "CRAP report skipped: lizard did not install" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

name: Rust checks

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner labels as JSON, e.g. '"ubuntu-latest"' or '["self-hosted","linux"]'
        type: string
        default: '"ubuntu-latest"'
      working-directory:
        description: The project's directory, relative to the repo root
        type: string
        default: .
      deny-allowlist:
        description: The repo's cargo-deny allowlist, merged into the shared deny.toml
        type: string
        default: .github/checks/deny-allowlist.toml
      unit-tests:
        description: The unit-test targets coverage measures, space-separated --lib, --bins, --bin=<name> or --test=<name>
        type: string
        default: --lib --bins
      jobs:
        description: The static-check jobs as JSON, [{"name", "checks"}]; a check in no job does not run
        type: string
        default: '[{"name":"Checks","checks":["format","lint","comment-budget","type-check","unused-dependencies","dependency-rules"]}]'
      coverage:
        description: Run coverage
        type: boolean
        default: true
      coverage-shards:
        description: Coverage shards as a JSON list, each one parallel job's unit-tests value; empty measures in one job
        type: string
        default: ""

permissions:
  contents: read

# Fast checks share one job; only the coverage run, which runs the tests, gets its own, in parallel.
# Steps shared by jobs are YAML anchors (&name) defined at first use and reused by alias (*name).
jobs:
  checks:
    name: ${{ matrix.job.name }}
    if: ${{ inputs.jobs != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(inputs.jobs) }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 60
    env:
      RG: ${{ github.workspace }}/repo-guards/ci-checks
      BASE_REF: &base-ref ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.merge_group.base_sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || format('origin/{0}', github.event.repository.default_branch) }}
      CARGO_TERM_COLOR: always
      TOOLCHAIN: rust-toolchain.toml
      COMPONENTS: rustfmt,clippy
    defaults: &defaults
      run:
        shell: bash
        working-directory: repo/${{ inputs.working-directory }}
    steps:
      - &checkout
        name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 0
          persist-credentials: false
      # job.workflow_* is this file's repo and commit; the toJSON round trip hides it from actionlint 1.7.12, which lacks it.
      - &checkout-repo-guards
        name: Check out repo-guards at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          path: repo-guards
          persist-credentials: false
      - &install-uv
        name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      # The job's TOOLCHAIN file (rust-toolchain.toml or coverage.toml) names the toolchain; COMPONENTS adds to it.
      - &install-rust
        name: Install Rust
        run: |
          toolchain=$(sed -n -E 's/^(channel|toolchain) = "(.*)"$/\2/p' "$RG/rust/$TOOLCHAIN")
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
            echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
            export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH"
          fi
          rustup toolchain install "$toolchain" --profile minimal ${COMPONENTS:+--component "$COMPONENTS"}
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - &cache
        name: Cache Rust builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: repo/${{ inputs.working-directory }}
          save-if: ${{ github.event_name == 'push' }}
      - name: Install cargo-machete and cargo-deny
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-machete@0.9.2,cargo-deny@0.20.2
      - name: Format
        if: ${{ !cancelled() && contains(matrix.job.checks, 'format') }}
        run: uv run --no-project --python 3.12 "$RG/diff-filter/diff_filter.py" --base "$BASE_REF" --format paths -- cargo fmt --all --check --message-format short -- --config-path "$RG/rust/rustfmt.toml"
      - name: Lint
        if: ${{ !cancelled() && contains(matrix.job.checks, 'lint') }}
        run: uv run --no-project --python 3.12 "$RG/diff-filter/diff_filter.py" --base "$BASE_REF" --format cargo -- cargo clippy --workspace --all-targets --all-features --locked --message-format=json -- --cap-lints=warn
      - name: Comment budget
        if: ${{ !cancelled() && contains(matrix.job.checks, 'comment-budget') }}
        run: cargo run --release --locked --manifest-path "$RG/rust/comment-budget/Cargo.toml" -- --base "$BASE_REF" --config "$RG/rust/comment-budget.toml"
      - name: Type check and dead code
        if: ${{ !cancelled() && contains(matrix.job.checks, 'type-check') }}
        run: uv run --no-project --python 3.12 "$RG/diff-filter/diff_filter.py" --base "$BASE_REF" --format cargo -- cargo check --workspace --all-features --locked --message-format=json
      - name: Unused dependencies
        if: ${{ !cancelled() && contains(matrix.job.checks, 'unused-dependencies') }}
        run: cargo machete
      - name: Dependency rules
        if: ${{ !cancelled() && contains(matrix.job.checks, 'dependency-rules') }}
        env:
          ALLOWLIST: ${{ inputs.deny-allowlist }}
        run: |
          uv run --no-project --python 3.12 "$RG/rust/deny-merge/deny_merge.py" "$RG/rust/deny.toml" "$RG/licenses.toml" "$GITHUB_WORKSPACE/repo/$ALLOWLIST" "$RUNNER_TEMP/deny.toml"
          cargo deny --locked --config "$RUNNER_TEMP/deny.toml" check

  # The coverage steps run the PR's tests, so they get a job of their own.
  coverage:
    name: Coverage
    needs: coverage-shard
    if: ${{ !cancelled() && inputs.coverage }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 60
    env:
      RG: ${{ github.workspace }}/repo-guards/ci-checks
      BASE_REF: *base-ref
      CARGO_TERM_COLOR: always
      TOOLCHAIN: coverage.toml
      COMPONENTS: llvm-tools-preview
      MODE: ${{ inputs.coverage-shards != '' && 'merge' || 'whole' }}
      SHARDS_RESULT: ${{ needs.coverage-shard.result }}
      UNIT_TESTS: ${{ inputs.coverage-shards != '' && join(fromJSON(inputs.coverage-shards), ' ') || inputs.unit-tests }}
    defaults: *defaults
    steps:
      - *checkout
      - *checkout-repo-guards
      - *install-uv
      - *install-rust
      - *cache
      - &install-llvm-cov
        name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Install diff-cover
        working-directory: ${{ runner.temp }}
        run: |
          uv venv --python 3.12 coverage-venv
          uv pip install --python coverage-venv/bin/python --require-hashes -r "$RG/coverage/requirements.txt"
      - name: Download shard profiles
        if: ${{ needs.coverage-shard.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rust-coverage-*
          path: ${{ runner.temp }}/shards
          merge-multiple: true
      # MODE whole measures and reports; shard keeps its raw profiles; merge rebuilds the test binaries and reports on every shard's profiles.
      - &coverage
        name: Coverage
        id: coverage
        if: ${{ !cancelled() }}
        run: |
          # Target selectors only: any other cargo-llvm-cov option could loosen the locked coverage config.
          # -d '' reads past newlines, so a multi-line value is checked whole; read then returns 1 at its end.
          read -ra targets -d '' <<< "$UNIT_TESTS" || true
          for target in "${targets[@]}"; do
            if [[ ! $target =~ ^--(lib|bins|(bin|test)=[A-Za-z0-9_-]+)$ ]]; then
              echo "::error::unit-tests: $target is not --lib, --bins, --bin=<name> or --test=<name>"
              exit 1
            fi
          done
          if (( ${#targets[@]} == 0 )); then
            echo "::error::unit-tests names no test target"
            exit 1
          fi
          regex=$(sed -n "s/^ignore-filename-regex = '\(.*\)'$/\1/p" "$RG/rust/coverage.toml")
          llvm_cov=(cargo llvm-cov --workspace --all-features --locked --branch "${targets[@]}")
          case $MODE in
            whole)
              "${llvm_cov[@]}" --ignore-filename-regex "$regex" --cobertura --output-path "$RUNNER_TEMP/coverage-head.xml"
              exit ;;
            merge)
              [[ $SHARDS_RESULT == success ]] || { echo "::error::a coverage shard failed ($SHARDS_RESULT)"; exit 1; } ;;
          esac
          profiles=$(cargo metadata --format-version 1 --no-deps | sed -E 's/.*"target_directory":"([^"]*)".*/\1/')/llvm-cov-target
          # --no-report keeps earlier runs' profiles, which a self-hosted runner's target directory may hold.
          rm -f "$profiles"/*.profraw
          if [[ $MODE == shard ]]; then
            "${llvm_cov[@]}" --no-report
            mkdir -p "$RUNNER_TEMP/shard"
            # Shards share profile file names, so each prefixes its own.
            for profile in "$profiles"/*.profraw; do cp "$profile" "$RUNNER_TEMP/shard/$SHARD-${profile##*/}"; done
            exit
          fi
          # --list builds every shard's test binaries and runs no test.
          "${llvm_cov[@]}" --no-report -- --list > /dev/null
          cp "$RUNNER_TEMP"/shards/*.profraw "$profiles/"
          cargo llvm-cov report --branch --ignore-filename-regex "$regex" --cobertura --output-path "$RUNNER_TEMP/coverage-head.xml"
      - name: Coverage gate
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        run: |
          PATH="$RUNNER_TEMP/coverage-venv/bin:$PATH" python "$RG/coverage/coverage_gate.py" --config "$RG/coverage/coverage.toml" \
            --head "$RUNNER_TEMP/coverage-head.xml" --compare-branch "$BASE_REF"
      # Report only: lizard installs inside the step, and a failure anywhere leaves the job result unchanged.
      - name: CRAP report
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          if uv venv -q --no-config --clear --python 3.12 "$RUNNER_TEMP/crap-venv" \
            && uv pip install -q --no-config --python "$RUNNER_TEMP/crap-venv/bin/python" --require-hashes -r "$RG/crap/requirements.txt"; then
            "$RUNNER_TEMP/crap-venv/bin/python" "$RG/crap/crap_report.py" --coverage "$RUNNER_TEMP/coverage-head.xml"
          else
            echo "CRAP report skipped: lizard did not install" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  # One job per coverage-shards item, running only its unit-tests targets; Coverage merges their profiles.
  coverage-shard:
    name: Coverage shard ${{ matrix.unit-tests }}
    if: ${{ inputs.coverage && inputs.coverage-shards != '' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        unit-tests: ${{ fromJSON(inputs.coverage-shards) }}
    env:
      RG: ${{ github.workspace }}/repo-guards/ci-checks
      CARGO_TERM_COLOR: always
      TOOLCHAIN: coverage.toml
      COMPONENTS: llvm-tools-preview
      MODE: shard
      SHARD: ${{ strategy.job-index }}
      UNIT_TESTS: ${{ matrix.unit-tests }}
    defaults: *defaults
    steps:
      - *checkout
      - *checkout-repo-guards
      - *install-rust
      - *cache
      - *install-llvm-cov
      - *coverage
      - name: Upload shard profiles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage-${{ strategy.job-index }}
          path: ${{ runner.temp }}/shard
          if-no-files-found: error
          retention-days: 1

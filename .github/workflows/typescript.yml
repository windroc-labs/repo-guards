name: TypeScript checks

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner labels as JSON, e.g. '"ubuntu-latest"' or '["self-hosted","linux"]'
        type: string
        default: '"ubuntu-latest"'
      knip-entry:
        description: knip entry globs as JSON; a trailing ! marks shipped code
        type: string
        default: '["src/index.ts!"]'
      knip-project:
        description: knip project globs as JSON; a trailing ! marks shipped code, which coverage also measures
        type: string
        default: '["src/**/*.ts!"]'
      deny-allowlist:
        description: The repo's dependency allowlist, the same file for every language; may be absent
        type: string
        default: .github/checks/deny-allowlist.toml
      license-exceptions:
        description: The repo's packages exempt from the license check, one per line; may be absent
        type: string
        default: .github/checks/license-exceptions.txt

permissions:
  contents: read

# Fast checks share one job; only the coverage run, which runs the tests twice, gets its own, in parallel.
# Steps shared by jobs are YAML anchors (&name) defined at first use and reused by alias (*name).
jobs:
  checks:
    name: Checks
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 40
    env:
      RG: ${{ github.workspace }}/repo-guards/ci-checks
      ALLOWLIST: ${{ github.workspace }}/repo/${{ inputs.deny-allowlist }}
      BASE_REF: &base-ref ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.merge_group.base_sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || format('origin/{0}', github.event.repository.default_branch) }}
    defaults: &defaults
      run:
        shell: bash
        working-directory: repo
    steps:
      - &checkout
        name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 0
          persist-credentials: false
      # job.workflow_* is this file's repo and commit; the toJSON round trip hides it from actionlint 1.7.12, which lacks it.
      - &checkout-repo-guards
        name: Check out repo-guards at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          path: repo-guards
          persist-credentials: false
      - &install-uv
        name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      - &install-node
        name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          package-manager-cache: false
      - &npmrc
        name: Apply the shared .npmrc
        run: |
          # Environment variables outrank the repo's own .npmrc.
          while IFS='=' read -r key value; do
            [[ -n "$key" ]] && echo "npm_config_${key//-/_}=$value" >> "$GITHUB_ENV"
          done < "$RG/typescript/.npmrc"
      # Listed git sources open npm's allow-git (Dependency rules checks each URL); listed build entries get their scripts run.
      - &allowlist
        name: Apply the dependency allowlist
        run: uv run --no-project --python 3.12 "$RG/allowlist/allowlist.py" env npm --allowlist "$ALLOWLIST" >> "$GITHUB_ENV"
      - name: Install the shared tools
        run: |
          mkdir -p "$RUNNER_TEMP/ts-tools"
          cp "$RG/typescript/package.json" "$RUNNER_TEMP/ts-tools/"
          npm install --prefix "$RUNNER_TEMP/ts-tools" --no-audit --no-fund --save-exact license-checker-rseidelsohn@5.0.1
          npm ci --prefix "$RG/typescript/comment-budget" --no-audit --no-fund
          echo "$RUNNER_TEMP/ts-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - &install-project
        name: Install the project
        run: |
          npm ci --no-audit --no-fund
          if [[ -n ${ALLOW_BUILD:-} ]]; then
            read -ra allowed <<< "$ALLOW_BUILD"
            npm_config_ignore_scripts=false npm rebuild "${allowed[@]}"
          fi
      - name: Format
        if: ${{ !cancelled() }}
        run: uv run --no-project --python 3.12 "$RG/diff-filter/diff_filter.py" --base "$BASE_REF" --format paths -- prettier --list-different --config "$RG/typescript/.prettierrc.json" .
      - name: Comment budget
        if: ${{ !cancelled() }}
        run: node "$RG/typescript/comment-budget/comment-budget.ts" --base "$BASE_REF" --config "$RG/typescript/comment-budget.toml"
      - name: Type check
        if: ${{ !cancelled() }}
        run: |
          mapfile -t flags < <(node -e 'for (const [k, v] of Object.entries(require(process.argv[1]).compilerOptions)) console.log(`--${k}\n${v}`)' "$RG/typescript/tsconfig.json")
          uv run --no-project --python 3.12 "$RG/diff-filter/diff_filter.py" --base "$BASE_REF" --format tsc -- tsc --project tsconfig.json --noEmit --pretty false "${flags[@]}"
      - name: Dead code and unused dependencies
        if: ${{ !cancelled() }}
        env:
          ENTRY: ${{ inputs.knip-entry }}
          PROJECT: ${{ inputs.knip-project }}
        run: |
          node -e 'const [src, entry, project, out] = process.argv.slice(1); const c = require(src); c.entry = JSON.parse(entry); c.project = JSON.parse(project); require("fs").writeFileSync(out, JSON.stringify(c))' "$RG/typescript/knip.json" "$ENTRY" "$PROJECT" "$RUNNER_TEMP/knip.json"
          uv run --no-project --python 3.12 "$RG/diff-filter/diff_filter.py" --base "$BASE_REF" --format knip -- knip --production --config "$RUNNER_TEMP/knip.json" --reporter json
      - name: Dependency rules
        if: ${{ !cancelled() }}
        run: uv run --no-project --python 3.12 "$RG/allowlist/allowlist.py" check npm --allowlist "$ALLOWLIST" --lock package-lock.json
      - name: Vulnerabilities
        if: ${{ !cancelled() }}
        run: npm audit
      - name: Licenses
        if: ${{ !cancelled() }}
        env:
          EXCEPTIONS: ${{ inputs.license-exceptions }}
        run: |
          allowed=$(node -e 'const { parse } = require(require.resolve("smol-toml", { paths: [process.argv[1]] })); console.log(parse(require("fs").readFileSync(process.argv[2], "utf8")).allow.join(";"))' "$RG/typescript/comment-budget" "$RG/licenses.toml")
          excluded=()
          if [[ -f "$EXCEPTIONS" ]]; then
            mapfile -t excluded < <(grep -v '^[[:space:]]*$' "$EXCEPTIONS" || true)
          fi
          # Each licenses.exceptions entry: its package is checked alone, against the shared list plus its own licenses.
          exceptions=$(uv run --no-project --python 3.12 "$RG/allowlist/allowlist.py" licenses --allowlist "$ALLOWLIST")
          failed=0
          while IFS=$'\t' read -r spec extra; do
            [[ -n $spec ]] || continue
            excluded+=("$spec")
            license-checker-rseidelsohn --includePackages "$spec" --onlyAllow "$allowed;$extra" --excludePrivatePackages || failed=1
          done <<< "$exceptions"
          args=(--onlyAllow "$allowed" --excludePrivatePackages)
          if (( ${#excluded[@]} )); then
            args+=(--excludePackages "$(IFS=';'; echo "${excluded[*]}")")
          fi
          license-checker-rseidelsohn "${args[@]}" || failed=1
          exit "$failed"

  # The coverage steps run the PR's tests, so they get a job of their own.
  coverage:
    name: Coverage
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 40
    env:
      RG: ${{ github.workspace }}/repo-guards/ci-checks
      ALLOWLIST: ${{ github.workspace }}/repo/${{ inputs.deny-allowlist }}
      BASE_REF: *base-ref
    defaults: *defaults
    steps:
      - *checkout
      - *checkout-repo-guards
      - *install-uv
      - *install-node
      - *npmrc
      - *allowlist
      - name: Install diff-cover
        working-directory: ${{ runner.temp }}
        run: |
          uv venv --python 3.12 coverage-venv
          uv pip install --python coverage-venv/bin/python --require-hashes -r "$RG/coverage/requirements.txt"
      - *install-project
      - name: Coverage
        id: coverage
        if: ${{ !cancelled() }}
        env:
          PROJECT: ${{ inputs.knip-project }}
        run: |
          flags=(--coverage.enabled=true --coverage.provider=v8 --coverage.reporter=cobertura)
          mapfile -t include < <(node -e 'for (const g of JSON.parse(process.argv[1])) if (g.endsWith("!")) console.log(g.slice(0, -1))' "$PROJECT")
          mapfile -t exclude < <(node -e 'for (const g of require(process.argv[1]).exclude) console.log(g)' "$RG/typescript/coverage.json")
          for glob in "${include[@]}"; do flags+=("--coverage.include=$glob"); done
          for glob in "${exclude[@]}"; do flags+=("--coverage.exclude=$glob"); done
          measure() {
            npx --no-install vitest run "${flags[@]}" --coverage.reportsDirectory="$RUNNER_TEMP/$1" \
              && mv "$RUNNER_TEMP/$1/cobertura-coverage.xml" "$RUNNER_TEMP/$1.xml"
          }
          # A self-hosted runner keeps repo/.git but empties RUNNER_TEMP: drop the last job's stale registration.
          git worktree prune
          git worktree add --detach "$RUNNER_TEMP/base" "$(git merge-base "$BASE_REF" HEAD)"
          (cd "$RUNNER_TEMP/base" && npm ci --no-audit --no-fund && measure coverage-base) || echo "::warning::Tests at the merge-base failed"
          measure coverage-head
      - name: Coverage gate
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        run: |
          PATH="$RUNNER_TEMP/coverage-venv/bin:$PATH" python "$RG/coverage/coverage_gate.py" --config "$RG/coverage/coverage.toml" \
            --head "$RUNNER_TEMP/coverage-head.xml" --base "$RUNNER_TEMP/coverage-base.xml" --compare-branch "$BASE_REF"
      # Report only: lizard installs inside the step, and a failure anywhere leaves the job result unchanged.
      - name: CRAP report
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          if uv venv -q --no-config --clear --python 3.12 "$RUNNER_TEMP/crap-venv" \
            && uv pip install -q --no-config --python "$RUNNER_TEMP/crap-venv/bin/python" --require-hashes -r "$RG/crap/requirements.txt"; then
            "$RUNNER_TEMP/crap-venv/bin/python" "$RG/crap/crap_report.py" --coverage "$RUNNER_TEMP/coverage-head.xml"
          else
            echo "CRAP report skipped: lizard did not install" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

name: .github changes in their own PR

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner labels as JSON, e.g. '"ubuntu-latest"' or '["self-hosted","linux"]'
        type: string
        default: '"ubuntu-latest"'

permissions:
  contents: read

jobs:
  github-dir-pr:
    name: .github changes in their own PR
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    env:
      # uv runs inside the PR checkout: never read its uv.toml or pyproject.toml [tool.uv].
      UV_NO_CONFIG: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 0
          persist-credentials: false
      # job.workflow_* is this file's repo and commit; the toJSON round trip hides it from actionlint 1.7.12, which lacks it.
      - name: Check out repo-guards at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          path: repo-guards
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      - name: .github changes in their own PR
        shell: bash
        working-directory: repo
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: uv run --no-project --python 3.12 "$GITHUB_WORKSPACE/repo-guards/guards/ci-checks/github-dir-pr/github_dir_pr.py" "$BASE_REF"

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

env:
  # PR runs check out the merge ref: HEAD^1 is the base, HEAD^2 the PR head.
  RANGE: ${{ github.event_name == 'pull_request' && 'HEAD^1..HEAD^2' || format('{0}..HEAD', github.event.before) }}

jobs:
  scan:
    name: Public rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the default branch's scanner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: default
          persist-credentials: false
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          scanner=default/scanner/scan.py
          # The PR that adds this workflow lands before the default branch has a scanner.
          [[ -f $scanner ]] || scanner=repo/scanner/scan.py
          args=()
          if [[ $EVENT == pull_request ]]; then
            # Read from the event file: the log echoes a step's env: block, which would publish hits in the title or body.
            PR_TITLE=$(jq -r '.pull_request.title // ""' "$GITHUB_EVENT_PATH")
            PR_BODY=$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")
            export PR_TITLE PR_BODY
            args+=(--pr-from-env)
          elif ! git -C repo cat-file -e "${RANGE%..HEAD}^{commit}" 2>/dev/null; then
            # A new branch (all-zero before) or an unknown before: scan the pushed head.
            RANGE='HEAD^!'
          fi
          python3 "$scanner" --repo repo --checks local-path,email,em-dash,link --commits "$RANGE" "${args[@]}"

  tools:
    name: gitleaks and actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      ACTIONLINT_URL: https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      GITLEAKS_CONFIG_URL: https://raw.githubusercontent.com/gitleaks/gitleaks/83d9cd684c87d95d656c1458ef04895a7f1cbd8e/config/gitleaks.toml
      GITLEAKS_CONFIG_SHA256: e163e53b9e7e8a8511e77271e2b323ed057759542a6d988258afe3a1fa329caf
    steps:
      # gitleaks always reads <target>/.gitleaksignore, so it scans the checkout's parent and its .git, never the work tree root.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tree/repo
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks and actionlint
        id: install
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p bin empty
          for item in GITLEAKS ACTIONLINT GITLEAKS_CONFIG; do
            url=${item}_URL sha=${item}_SHA256
            curl -sSfL --retry 3 -o "$item" "${!url}"
            echo "${!sha}  $item" | sha256sum -c -
          done
          tar -xzf GITLEAKS -C bin gitleaks
          tar -xzf ACTIONLINT -C bin actionlint
          # The default config allowlists any path matching gitleaks\.toml, which would pass a secret put in such a file.
          entry="    '''gitleaks\.toml''',"
          grep -qxF "$entry" GITLEAKS_CONFIG
          grep -vxF "$entry" GITLEAKS_CONFIG > gitleaks.toml
          : > actionlint.yaml
      - name: gitleaks
        id: gitleaks
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ $EVENT != pull_request ]] && ! git -C tree/repo cat-file -e "${RANGE%..HEAD}^{commit}" 2>/dev/null; then
            RANGE='HEAD^!'
          fi
          messages=$RUNNER_TEMP/messages
          mkdir -p "$messages/m"
          for sha in $(git -C tree/repo log --format=%H "$RANGE"); do
            git -C tree/repo log -1 --format=%B "$sha" > "$messages/m/$sha"
          done
          bin=$RUNNER_TEMP/bin/gitleaks
          opts=(--config "$RUNNER_TEMP/gitleaks.toml" --gitleaks-ignore-path "$RUNNER_TEMP/empty" --ignore-gitleaks-allow
                --redact --no-banner --log-level error --exit-code 3 --report-format json)
          for scan in files commits messages; do
            case $scan in
              files) target=(dir "$GITHUB_WORKSPACE/tree") ;;
              commits) target=(git "$GITHUB_WORKSPACE/tree/repo/.git" --log-opts "--diff-merges=first-parent $RANGE") ;;
              messages) target=(dir "$messages") ;;
            esac
            code=0
            err=$RUNNER_TEMP/gitleaks-$scan.err
            "$bin" "${target[@]}" "${opts[@]}" --report-path "$RUNNER_TEMP/gitleaks-$scan.json" 2> "$err" || code=$?
            # gitleaks exits 0 when git itself fails, so any error-level log counts as a failed scan.
            if (( code != 0 && code != 3 )) || [[ -s $err ]]; then
              cat "$err"
              echo "::error::gitleaks $scan scan failed with exit code $code"
              exit 1
            fi
          done
          python3 "$GITHUB_WORKSPACE/tree/repo/scanner/gitleaks_report.py" "$GITHUB_WORKSPACE/tree/repo" "$RUNNER_TEMP"
      - name: actionlint
        id: actionlint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: tree/repo
        run: |
          code=0
          "$RUNNER_TEMP/bin/actionlint" -config-file "$RUNNER_TEMP/actionlint.yaml" -shellcheck= -pyflakes= -oneline > "$RUNNER_TEMP/actionlint.txt" || code=$?
          cat "$RUNNER_TEMP/actionlint.txt"
          if (( code > 1 )); then
            echo "::error::actionlint failed with exit code $code"
            exit 1
          fi
          echo "hits=$(grep -c . "$RUNNER_TEMP/actionlint.txt")" >> "$GITHUB_OUTPUT"
      - name: Summary
        if: ${{ !cancelled() }}
        env:
          GITLEAKS_HITS: ${{ steps.gitleaks.outputs.hits || 'not run' }}
          ACTIONLINT_HITS: ${{ steps.actionlint.outputs.hits || 'not run' }}
        run: |
          echo "summary:"
          printf '  %-10s  %-7s  %s\n' gitleaks leak "$GITLEAKS_HITS" actionlint hygiene "$ACTIONLINT_HITS"
          if [[ $GITLEAKS_HITS != 0 && $GITLEAKS_HITS != 'not run' ]]; then
            echo 'Leak-class hits are already public: follow "If something leaks" in AGENTS.md.'
          fi
          [[ $GITLEAKS_HITS == 0 && $ACTIONLINT_HITS == 0 ]]

  tests:
    name: Checker tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
    defaults:
      run:
        working-directory: repo
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          package-manager-cache: false
      - name: Install Rust from the shared rust-toolchain.toml
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' ci-checks/rust/rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
      - name: Install Go from the shared .go-version
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: repo/ci-checks/go/.go-version
          cache: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      - name: Scanner tests
        id: scanner
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s scanner -p 'test_*.py'
      - name: Python comment budget tests
        id: python
        if: ${{ !cancelled() }}
        working-directory: repo/ci-checks/python/comment-budget
        run: python3 -m unittest comment_budget_test
      - name: Python pyproject config tests
        id: pyproject-config
        if: ${{ !cancelled() }}
        working-directory: repo/ci-checks/python/pyproject-config
        run: python3 -m unittest pyproject_config_test
      - name: TypeScript comment budget tests
        id: typescript
        if: ${{ !cancelled() }}
        working-directory: repo/ci-checks/typescript/comment-budget
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npm test
      - name: TypeScript workflow config tests
        id: workflow-config
        if: ${{ !cancelled() }}
        working-directory: repo/ci-checks/typescript/workflow-config
        run: node --test workflow-config.test.ts
      - name: Dependency allowlist tests
        id: dependency-allowlist
        if: ${{ !cancelled() }}
        working-directory: repo/ci-checks/dependency-allowlist
        run: python3 -m unittest dependency_allowlist_test
      - name: config-overrides tests
        id: config-overrides
        if: ${{ !cancelled() }}
        working-directory: repo/ci-checks/config-overrides
        run: python3 -m unittest config_overrides_test
      - name: fetch-ci-checks tests
        id: fetch-ci-checks
        if: ${{ !cancelled() }}
        working-directory: repo/ci-checks/fetch-ci-checks
        run: python3 -m unittest fetch_ci_checks_test
      - name: inline-exemptions tests
        id: inline-exemptions
        if: ${{ !cancelled() }}
        working-directory: repo/ci-checks/inline-exemptions
        run: python3 -m unittest inline_exemptions_test
      - name: layer-rules tests
        id: layer-rules
        if: ${{ !cancelled() }}
        working-directory: repo/ci-checks/layer-rules
        run: python3 -m unittest layer_rules_test
      - name: github-dir-pr tests
        id: github-dir-pr
        if: ${{ !cancelled() }}
        working-directory: repo/ci-checks/github-dir-pr
        run: python3 -m unittest github_dir_pr_test
      - name: deny-merge tests
        id: deny-merge
        if: ${{ !cancelled() }}
        working-directory: repo/ci-checks/rust/deny-merge
        run: python3 -m unittest deny_merge_test
      - name: language-gate tests
        id: language-gate
        if: ${{ !cancelled() }}
        working-directory: repo/ci-checks/language-gate
        run: python3 -m unittest language_gate_test
      - name: api-snapshot tests
        id: api-snapshot
        if: ${{ !cancelled() }}
        working-directory: repo/ci-checks/api-snapshot
        run: python3 -m unittest api_snapshot_test snapshot_artifact_test
      - name: Python API snapshot tests
        id: python-api-snapshot
        if: ${{ !cancelled() }}
        working-directory: repo/ci-checks/python/api-snapshot
        run: |
          uv venv -q --python 3.14 "$RUNNER_TEMP/python-api-venv"
          uv pip install -q --python "$RUNNER_TEMP/python-api-venv/bin/python" --require-hashes -r requirements.txt
          "$RUNNER_TEMP/python-api-venv/bin/python" -m unittest python_api_test
      - name: shard-artifact tests
        id: shard-artifact
        if: ${{ !cancelled() }}
        working-directory: repo/ci-checks/coverage
        run: python3 -m unittest shard_artifact_test
      - name: Rust coverage LCOV tests
        id: rust-coverage-lcov
        if: ${{ !cancelled() }}
        working-directory: repo/ci-checks/rust/coverage-lcov
        run: python3 -m unittest coverage_lcov_test
      - name: Rust comment budget tests
        id: rust
        if: ${{ !cancelled() }}
        working-directory: repo/ci-checks/rust/comment-budget
        run: cargo test --locked
      - name: Go comment budget tests
        id: go-comment-budget
        if: ${{ !cancelled() }}
        working-directory: repo/ci-checks/go/comment-budget
        run: go test ./...
      - name: Go coverage profile tests
        id: go-coverage-profile
        if: ${{ !cancelled() }}
        working-directory: repo/ci-checks/go/coverage-profile
        run: python3 -m unittest coverage_profile_test
      - name: Go license check tests
        id: go-license-check
        if: ${{ !cancelled() }}
        working-directory: repo/ci-checks/go/license-check
        run: go test ./...
      - name: Go API snapshot tests
        id: go-api-snapshot
        if: ${{ !cancelled() }}
        working-directory: repo/ci-checks/go/api-snapshot
        run: go test ./...
      - name: Python inline exemptions tests
        id: python-inline-exemptions
        if: ${{ !cancelled() }}
        working-directory: repo/ci-checks/python/inline-exemptions
        run: python3 -m unittest exemptions_test
      - name: Python layer rules tests
        id: python-layer-rules
        if: ${{ !cancelled() }}
        working-directory: repo/ci-checks/python/layer-rules
        run: python3 -m unittest imports_test
      - name: Go inline exemptions tests
        id: go-inline-exemptions
        if: ${{ !cancelled() }}
        working-directory: repo/ci-checks/go/inline-exemptions
        run: go test ./...
      - name: TypeScript inline exemptions tests
        id: typescript-inline-exemptions
        if: ${{ !cancelled() }}
        working-directory: repo/ci-checks/typescript/inline-exemptions
        run: npm ci --no-audit --no-fund --ignore-scripts && npm test
      - name: Rust inline exemptions tests
        id: rust-inline-exemptions
        if: ${{ !cancelled() }}
        working-directory: repo/ci-checks/rust/inline-exemptions
        run: cargo test --locked
      - name: Rust layer rules tests
        id: rust-layer-rules
        if: ${{ !cancelled() }}
        working-directory: repo/ci-checks/rust/layer-rules
        run: cargo test --locked
      - name: Rust API snapshot tests
        id: rust-api-snapshot
        if: ${{ !cancelled() }}
        working-directory: repo/ci-checks/rust/api-snapshot
        # rustdoc JSON needs the nightly the API snapshot job pins.
        run: |
          toolchain=$(sed -n 's/^toolchain = "\(.*\)"$/\1/p' ../api-snapshot.toml)
          rustup toolchain install "$toolchain" --profile minimal
          RUSTUP_TOOLCHAIN=$toolchain cargo test --locked
      - name: Summary
        if: ${{ !cancelled() }}
        env:
          SCANNER: ${{ steps.scanner.outcome }}
          PYTHON: ${{ steps.python.outcome }}
          TYPESCRIPT: ${{ steps.typescript.outcome }}
          RUST: ${{ steps.rust.outcome }}
          CONFIG_OVERRIDES: ${{ steps.config-overrides.outcome }}
          FETCH_CI_CHECKS: ${{ steps.fetch-ci-checks.outcome }}
          INLINE_EXEMPTIONS: ${{ steps.inline-exemptions.outcome }}
          GITHUB_DIR_PR: ${{ steps.github-dir-pr.outcome }}
          DENY_MERGE: ${{ steps.deny-merge.outcome }}
          DEPENDENCY_ALLOWLIST: ${{ steps.dependency-allowlist.outcome }}
          GO_COMMENT_BUDGET: ${{ steps.go-comment-budget.outcome }}
          GO_LICENSE_CHECK: ${{ steps.go-license-check.outcome }}
          GO_API_SNAPSHOT: ${{ steps.go-api-snapshot.outcome }}
          GO_COVERAGE_PROFILE: ${{ steps.go-coverage-profile.outcome }}
          LANGUAGE_GATE: ${{ steps.language-gate.outcome }}
          API_SNAPSHOT: ${{ steps.api-snapshot.outcome }}
          PYTHON_API_SNAPSHOT: ${{ steps.python-api-snapshot.outcome }}
          SHARD_ARTIFACT: ${{ steps.shard-artifact.outcome }}
          RUST_COVERAGE_LCOV: ${{ steps.rust-coverage-lcov.outcome }}
          PYPROJECT_CONFIG: ${{ steps.pyproject-config.outcome }}
          WORKFLOW_CONFIG: ${{ steps.workflow-config.outcome }}
          PYTHON_INLINE_EXEMPTIONS: ${{ steps.python-inline-exemptions.outcome }}
          GO_INLINE_EXEMPTIONS: ${{ steps.go-inline-exemptions.outcome }}
          TYPESCRIPT_INLINE_EXEMPTIONS: ${{ steps.typescript-inline-exemptions.outcome }}
          RUST_INLINE_EXEMPTIONS: ${{ steps.rust-inline-exemptions.outcome }}
          LAYER_RULES: ${{ steps.layer-rules.outcome }}
          PYTHON_LAYER_RULES: ${{ steps.python-layer-rules.outcome }}
          RUST_API_SNAPSHOT: ${{ steps.rust-api-snapshot.outcome }}
          RUST_LAYER_RULES: ${{ steps.rust-layer-rules.outcome }}
        run: |
          failed=0
          for suite in SCANNER PYTHON TYPESCRIPT RUST CONFIG_OVERRIDES FETCH_CI_CHECKS INLINE_EXEMPTIONS GITHUB_DIR_PR DENY_MERGE DEPENDENCY_ALLOWLIST GO_COMMENT_BUDGET GO_LICENSE_CHECK GO_API_SNAPSHOT GO_COVERAGE_PROFILE LANGUAGE_GATE API_SNAPSHOT PYTHON_API_SNAPSHOT SHARD_ARTIFACT RUST_COVERAGE_LCOV PYPROJECT_CONFIG WORKFLOW_CONFIG PYTHON_INLINE_EXEMPTIONS GO_INLINE_EXEMPTIONS TYPESCRIPT_INLINE_EXEMPTIONS RUST_INLINE_EXEMPTIONS LAYER_RULES PYTHON_LAYER_RULES RUST_API_SNAPSHOT RUST_LAYER_RULES; do
            printf '  %-10s  %s\n' "${suite,,}" "${!suite}"
            [[ ${!suite} == success ]] || failed=$((failed + 1))
          done
          echo "summary:"
          printf '  %-13s  %-7s  %s\n' checker-tests hygiene "$failed"
          (( failed == 0 ))

name: Rust checks

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner labels as JSON, e.g. '"ubuntu-latest"' or '["self-hosted","linux"]'
        type: string
        default: '"ubuntu-latest"'
      working-directory:
        description: The project's directory, relative to the repo root
        type: string
        default: .
      unit-tests:
        description: The unit-test targets coverage measures, space-separated --lib, --bins, --bin=<name> or --test=<name>, then optionally -- and test-name filters
        type: string
        default: --lib --bins
      coverage-shards:
        description: Coverage shards as a JSON list, each one parallel job's unit-tests value, e.g. "--test=unit -- input::"; [] measures in one job
        type: string
        default: "[]"

permissions:
  contents: read

# Changes runs first and decides whether a PR runs the other jobs.
# Fast checks share one job; the coverage run, which runs the tests, and the API snapshot, which builds the project,
# each get their own, in parallel.
# Steps shared by jobs are YAML anchors (&name) defined at first use and reused by alias (*name).
jobs:
  # Only on a PR: run=false when it changes no rust file, config or repo-guards call or setting, and every other job skips.
  # Skipped (other events) or failed, run is empty and the other jobs run.
  changes:
    name: Changes
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    outputs:
      run: ${{ steps.gate.outputs.run }}
    env:
      RG: ${{ github.workspace }}/repo-guards/ci-checks
    steps:
      - name: Check out the merge ref and its parents
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 2
          persist-credentials: false
      # job.workflow_* is this file's repo and commit; the toJSON round trip hides it from actionlint 1.7.12, which lacks it.
      - &checkout-repo-guards
        name: Check out repo-guards at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          path: repo-guards
          persist-credentials: false
      - &install-uv
        name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      # The merge ref's first parent is the base branch, so HEAD^1..HEAD is what merging the PR changes.
      - name: Match changed files
        id: gate
        shell: bash
        working-directory: repo
        run: uv run --no-project --python 3.12 "$RG/language-gate/language_gate.py" rust HEAD^1 >> "$GITHUB_OUTPUT"

  checks:
    name: Checks
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 60
    env:
      RG: ${{ github.workspace }}/repo-guards/ci-checks
      BASE_REF: &base-ref ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.merge_group.base_sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || format('origin/{0}', github.event.repository.default_branch) }}
      CARGO_TERM_COLOR: always
      TOOLCHAIN: rust-toolchain.toml
      TOOLCHAIN_KEY: toolchain channel
      COMPONENTS: rustfmt,clippy
    defaults: &defaults
      run:
        shell: bash
        working-directory: repo/${{ inputs.working-directory }}
    steps:
      - &checkout
        name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 0
          persist-credentials: false
      - *checkout-repo-guards
      - *install-uv
      - &apply-overrides
        name: Apply caller overrides
        run: uv run --no-project --python 3.12 "$RG/config-overrides/config_overrides.py" apply "$GITHUB_WORKSPACE/repo-guards" "$GITHUB_WORKSPACE/repo/.github/checks/repo-guards.toml"
      # The job's TOOLCHAIN file (rust-toolchain.toml or coverage.toml) names the toolchain at TOOLCHAIN_KEY; COMPONENTS adds to it.
      # The Coverage job builds nothing in merge mode, so it skips the Rust steps; MODE is unset in Checks.
      - &install-rust
        name: Install Rust
        if: ${{ env.MODE != 'merge' }}
        run: |
          read -ra key <<< "$TOOLCHAIN_KEY"
          toolchain=$(uv run --no-project --python 3.12 "$RG/config-overrides/config_overrides.py" get "$RG/rust/$TOOLCHAIN" "${key[@]}")
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
            echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
            export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH"
          fi
          rustup toolchain install "$toolchain" --profile minimal ${COMPONENTS:+--component "$COMPONENTS"}
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - &cache
        name: Cache Rust builds
        if: ${{ env.MODE != 'merge' }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: repo/${{ inputs.working-directory }}
          save-if: ${{ github.event_name == 'push' }}
      - name: Install cargo-machete and cargo-deny
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-machete@0.9.2,cargo-deny@0.20.2
      - name: Inline exemptions
        id: inline-exemptions
        # The whole repo from its root, whatever working-directory is; UV_NO_CONFIG keeps the caller's uv config out.
        working-directory: repo
        env:
          UV_NO_CONFIG: "1"
        run: uv run --no-project --python 3.14 "$RG/inline-exemptions/inline_exemptions.py" rust
      - name: Layer rules
        if: ${{ !cancelled() && steps.inline-exemptions.outcome == 'success' }}
        # Parses the project's code and never builds or runs it: the step builds repo-guards' scanner and runs it from /.
        # uv looks the interpreter up from /: from the checkout, a cold lookup runs a committed .venv python and its .pth.
        working-directory: repo
        # Its own install dir: earlier uv steps read the worker's uv config, which can add Python builds to the shared one.
        env:
          PROJECT_DIR: ${{ inputs.working-directory }}
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/layer-rules-python
        run: |
          python=$(cd / && uv python install --no-config -q 3.14 && uv python find --no-config --managed-python 3.14)
          "$python" -I -S "$RG/layer-rules/layer_rules.py" rust --working-directory "$PROJECT_DIR" --base "$BASE_REF"
      - name: Format
        if: ${{ !cancelled() && steps.inline-exemptions.outcome == 'success' }}
        run: uv run --no-project --python 3.12 "$RG/diff-filter/diff_filter.py" --base "$BASE_REF" --format paths -- cargo fmt --all --check --message-format short -- --config-path "$RG/rust/rustfmt.toml"
      - name: Lint
        if: ${{ !cancelled() && steps.inline-exemptions.outcome == 'success' }}
        run: uv run --no-project --python 3.12 "$RG/diff-filter/diff_filter.py" --base "$BASE_REF" --format cargo -- cargo clippy --workspace --all-targets --all-features --locked --message-format=json -- --cap-lints=warn
      - name: Comment budget
        if: ${{ !cancelled() && steps.inline-exemptions.outcome == 'success' }}
        run: cargo run --release --locked --manifest-path "$RG/rust/comment-budget/Cargo.toml" -- --base "$BASE_REF" --config "$RG/rust/comment-budget.toml"
      - name: Type check and dead code
        if: ${{ !cancelled() && steps.inline-exemptions.outcome == 'success' }}
        run: uv run --no-project --python 3.12 "$RG/diff-filter/diff_filter.py" --base "$BASE_REF" --format cargo -- cargo check --workspace --all-features --locked --message-format=json
      - name: Unused dependencies
        if: ${{ !cancelled() && steps.inline-exemptions.outcome == 'success' }}
        run: cargo machete
      - name: Dependency rules
        if: ${{ !cancelled() && steps.inline-exemptions.outcome == 'success' }}
        run: |
          uv run --no-project --python 3.12 "$RG/rust/deny-merge/deny_merge.py" "$RG/rust/deny.toml" "$RG/licenses.toml" "$RUNNER_TEMP/deny.toml"
          cargo deny --locked --config "$RUNNER_TEMP/deny.toml" check
      - name: Dependency allowlist
        if: ${{ !cancelled() && steps.inline-exemptions.outcome == 'success' }}
        run: |
          base=$(git merge-base "$BASE_REF" HEAD)
          # No lock at the merge-base (a new project) leaves the base file absent: every crate counts as new.
          if git cat-file -e "$base:./Cargo.lock" 2>/dev/null; then git show "$base:./Cargo.lock" > "$RUNNER_TEMP/base-Cargo.lock"; fi
          uv run --no-project --python 3.12 "$RG/dependency-allowlist/dependency_allowlist.py" cargo "$RG/dependency-allowlist/allowlist.toml" "$RUNNER_TEMP/base-Cargo.lock" Cargo.lock

  # The coverage steps run the PR's tests, so they get a job of their own.
  coverage:
    name: Coverage
    needs: [changes, coverage-shard]
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 60
    env:
      RG: ${{ github.workspace }}/repo-guards/ci-checks
      BASE_REF: *base-ref
      CARGO_TERM_COLOR: always
      TOOLCHAIN: coverage.toml
      TOOLCHAIN_KEY: toolchain
      COMPONENTS: llvm-tools-preview
      MODE: ${{ inputs.coverage-shards != '[]' && 'merge' || 'whole' }}
      SHARDS_RESULT: ${{ needs.coverage-shard.result }}
      UNIT_TESTS: ${{ inputs.unit-tests }}
    defaults: *defaults
    steps:
      - *checkout
      - *checkout-repo-guards
      - *install-uv
      - *apply-overrides
      - *install-rust
      - *cache
      - &install-llvm-cov
        name: Install cargo-llvm-cov
        if: ${{ env.MODE != 'merge' }}
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Install diff-cover
        working-directory: ${{ runner.temp }}
        run: |
          uv venv --python 3.12 coverage-venv
          uv pip install --python coverage-venv/bin/python --require-hashes -r "$RG/coverage/requirements.txt"
      - name: Download shard reports
        if: ${{ needs.coverage-shard.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ needs.coverage-shard.outputs.artifact }}-*
          path: ${{ runner.temp }}/shards
          merge-multiple: true
      - &coverage
        name: Coverage
        id: coverage
        if: ${{ !cancelled() }}
        run: |
          if [[ $MODE == merge && $SHARDS_RESULT != success ]]; then
            echo "::error::a coverage shard failed ($SHARDS_RESULT)"
            exit 1
          fi
          # Each shard hands over LCOV of its own build: raw profiles match only binaries built for the same target.
          reports=("$RUNNER_TEMP"/shards/*.lcov)
          if [[ $MODE != merge ]]; then
            # -d '' reads past newlines, so a multi-line value is read whole; read then returns 1 at its end.
            read -ra targets -d '' <<< "$UNIT_TESTS" || true
            regex=$(uv run --no-project --python 3.12 "$RG/config-overrides/config_overrides.py" get "$RG/rust/coverage.toml" ignore-filename-regex)
            # The targets go last, so the test-name filters after their -- reach the test binaries.
            cargo llvm-cov --workspace --all-features --locked --branch --ignore-filename-regex "$regex" \
              --lcov --output-path "$RUNNER_TEMP/coverage.lcov" "${targets[@]}"
            reports=("$RUNNER_TEMP/coverage.lcov")
          fi
          lcov=(uv run --no-project --python 3.12 "$RG/rust/coverage-lcov/coverage_lcov.py" --root "$PWD")
          if [[ $MODE == shard ]]; then
            mkdir -p "$RUNNER_TEMP/shard"
            "${lcov[@]}" --format lcov --output "$RUNNER_TEMP/shard/$SHARD.lcov" "${reports[@]}"
            # Artifact names are unique per run, and a caller may call this workflow once per working-directory.
            artifact=$(uv run --no-project --python 3.12 "$RG/coverage/shard_artifact.py" rust "$PROJECT")
            echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
            exit
          fi
          "${lcov[@]}" --format cobertura --output "$RUNNER_TEMP/coverage-head.xml" "${reports[@]}"
      - name: Coverage gate
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        run: |
          PATH="$RUNNER_TEMP/coverage-venv/bin:$PATH" python "$RG/coverage/coverage_gate.py" --config "$RG/coverage/coverage.toml" \
            --head "$RUNNER_TEMP/coverage-head.xml" --compare-branch "$BASE_REF"
      # Report only: lizard installs inside the step, and a failure anywhere leaves the job result unchanged.
      - name: CRAP report
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          if uv venv -q --no-config --clear --python 3.12 "$RUNNER_TEMP/crap-venv" \
            && uv pip install -q --no-config --python "$RUNNER_TEMP/crap-venv/bin/python" --require-hashes -r "$RG/crap/requirements.txt"; then
            "$RUNNER_TEMP/crap-venv/bin/python" "$RG/crap/crap_report.py" --coverage "$RUNNER_TEMP/coverage-head.xml"
          else
            echo "CRAP report skipped: lizard did not install" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  # One job per coverage-shards item, running only its unit-tests targets; Coverage merges their LCOV reports.
  coverage-shard:
    name: Coverage shard ${{ matrix.unit-tests }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' && inputs.coverage-shards != '[]' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.coverage.outputs.artifact }}
    strategy:
      fail-fast: false
      matrix:
        unit-tests: ${{ fromJSON(inputs.coverage-shards) }}
    env:
      RG: ${{ github.workspace }}/repo-guards/ci-checks
      CARGO_TERM_COLOR: always
      TOOLCHAIN: coverage.toml
      TOOLCHAIN_KEY: toolchain
      COMPONENTS: llvm-tools-preview
      MODE: shard
      SHARD: ${{ strategy.job-index }}
      UNIT_TESTS: ${{ matrix.unit-tests }}
      PROJECT: ${{ inputs.working-directory }}
    defaults: *defaults
    steps:
      - *checkout
      - *checkout-repo-guards
      - *install-uv
      - *apply-overrides
      - *install-rust
      - *cache
      - *install-llvm-cov
      - *coverage
      - name: Upload shard reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.coverage.outputs.artifact }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/shard
          if-no-files-found: error
          retention-days: 1

  # Generating the snapshot builds the caller's code, so it gets a job of its own: read-only token, no secrets.
  api-snapshot:
    name: API snapshot
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      RG: ${{ github.workspace }}/repo-guards/ci-checks
      PROJECT_DIR: ${{ inputs.working-directory }}
      LANGUAGE: rust
      # Keeps a uv.toml or [tool.uv] in the PR from choosing the Python that reads the setting.
      UV_NO_CONFIG: "1"
    defaults: *defaults
    steps:
      - *checkout
      - *checkout-repo-guards
      - *install-uv
      - *apply-overrides
      - name: Read the snapshot settings
        id: setting
        run: |
          snapshot=$(uv run --no-project --python 3.12 "$RG/config-overrides/config_overrides.py" snapshot-path "$GITHUB_WORKSPACE/repo" "$PROJECT_DIR" "$LANGUAGE")
          artifact=$(uv run --no-project --python 3.12 "$RG/api-snapshot/snapshot_artifact.py" "$LANGUAGE" "$PROJECT_DIR")
          # The summary line keeps the word the docs and the acceptance scenario look for: 未启用 (not enabled).
          if [[ -z $snapshot ]]; then
            echo "API snapshot: 未启用 (not enabled): repo-guards.toml sets no api-snapshot.$LANGUAGE for this working-directory" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "path=$snapshot" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      # Installs the nightly pinned in api-snapshot.toml (rustdoc JSON is unstable) and builds repo-guards' generator
      # from /, before any of the caller's code runs, so the caller's .cargo/config.toml cannot change how it is built.
      - name: Build the API snapshot tool
        if: ${{ steps.setting.outputs.path != '' }}
        run: |
          toolchain=$(uv run --no-project --python 3.12 "$RG/config-overrides/config_overrides.py" get "$RG/rust/api-snapshot.toml" toolchain) || exit 2
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path || exit 2
            echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
            export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH"
          fi
          rustup toolchain install "$toolchain" --profile minimal || exit 2
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          cd / && RUSTUP_TOOLCHAIN=$toolchain cargo build --release --locked --manifest-path "$RG/rust/api-snapshot/Cargo.toml" \
            --target-dir "$RUNNER_TEMP/api-snapshot-tool" || exit 2
      # Builds every library crate of the workspace with all features (this runs the PR's build scripts and proc macros)
      # and writes its public API entries to $RUNNER_TEMP/api-entries.json; exit 2 when it cannot.
      - name: Generate
        if: ${{ steps.setting.outputs.path != '' }}
        env:
          API_SNAPSHOT_SCOPE: ${{ steps.setting.outputs.scope }}
        run: |
          "$RUNNER_TEMP/api-snapshot-tool/release/api-snapshot" --project "$PWD" --output "$RUNNER_TEMP/api-entries.json" || exit 2
      - name: Compare
        id: compare
        if: ${{ steps.setting.outputs.path != '' }}
        env:
          SNAPSHOT: ${{ steps.setting.outputs.path }}
          ARTIFACT: ${{ steps.setting.outputs.artifact }}
        run: |
          mkdir -p "$RUNNER_TEMP/api-snapshot"
          code=0
          uv run --no-project --python 3.12 "$RG/api-snapshot/api_snapshot.py" --entries "$RUNNER_TEMP/api-entries.json" \
            --snapshot "$GITHUB_WORKSPACE/repo/$SNAPSHOT" --output "$RUNNER_TEMP/api-snapshot/${SNAPSHOT##*/}" \
            --artifact "$ARTIFACT" --path "$SNAPSHOT" || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      # Exit 1: a mismatch or no snapshot file yet; the artifact holds the file to commit at the configured path.
      - name: Upload the new snapshot
        if: ${{ !cancelled() && steps.compare.outputs.code == '1' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.setting.outputs.artifact }}
          path: ${{ runner.temp }}/api-snapshot
          if-no-files-found: error

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  github-dir-pr:
    uses: windroc-labs/repo-guards/.github/workflows/github-dir-pr.yml@0000000000000000000000000000000000000000
  rust:
    uses: windroc-labs/repo-guards/.github/workflows/rust.yml@0000000000000000000000000000000000000000
    with:
      runs-on: '"ubuntu-latest"'
  python:
    uses: windroc-labs/repo-guards/.github/workflows/python.yml@0000000000000000000000000000000000000000
    with:
      runs-on: '["self-hosted","linux"]'
      source-dirs: src
  typescript:
    uses: windroc-labs/repo-guards/.github/workflows/typescript.yml@0000000000000000000000000000000000000000
    with:
      knip-entry: '["src/index.ts!"]'
  jscpd:
    uses: windroc-labs/repo-guards/.github/workflows/jscpd.yml@0000000000000000000000000000000000000000

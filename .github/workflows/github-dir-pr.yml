name: .github changes in their own PR

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner labels as JSON, e.g. '"ubuntu-latest"' or '["self-hosted","linux"]'
        type: string
        default: '"ubuntu-latest"'

permissions:
  contents: read

jobs:
  github-dir-pr:
    name: .github changes in their own PR
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: .github changes in their own PR
        shell: bash
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          changed="$RUNNER_TEMP/changed"
          git -c core.quotePath=false diff --name-only --no-renames -z "$BASE_REF"...HEAD > "$changed"
          mapfile -d '' files < "$changed"
          workflows=()
          others=()
          for f in "${files[@]}"; do
            if [[ $f == .github/* ]]; then
              workflows+=("$f")
            else
              others+=("$f")
            fi
          done
          if (( ${#workflows[@]} && ${#others[@]} )); then
            echo "::error::A PR that changes .github/ must change nothing else"
            printf '.github files:\n'
            printf '  %s\n' "${workflows[@]}"
            printf 'Other files:\n'
            printf '  %s\n' "${others[@]}"
            exit 1
          fi

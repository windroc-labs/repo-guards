name: TypeScript checks

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner labels as JSON, e.g. '"ubuntu-latest"' or '["self-hosted","linux"]'
        type: string
        default: '"ubuntu-latest"'
      working-directory:
        description: The project's directory, relative to the repo root
        type: string
        default: .
      coverage-shards:
        description: Coverage shards as a JSON list, each one parallel job's vitest file filters, space-separated; [] measures in one job
        type: string
        default: "[]"

permissions:
  contents: read

# Changes runs first and decides whether a PR runs the other jobs.
# Fast checks share one job; the coverage run, which runs the tests, and the API snapshot, which builds the project,
# each get their own, in parallel.
# Steps shared by jobs are YAML anchors (&name) defined at first use and reused by alias (*name).
jobs:
  # Only on a PR: run=false when it changes no typescript file, config or repo-guards call or setting, and every other job skips.
  # Skipped (other events) or failed, run is empty and the other jobs run.
  changes:
    name: Changes
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    outputs:
      run: ${{ steps.gate.outputs.run }}
    env:
      RG: ${{ github.workspace }}/repo-guards/ci-checks
    steps:
      - name: Check out the merge ref and its parents
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 2
          persist-credentials: false
      # job.workflow_* is this file's repo and commit; the toJSON round trip hides it from actionlint 1.7.12, which lacks it.
      - &checkout-repo-guards
        name: Check out repo-guards at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          path: repo-guards
          persist-credentials: false
      - &install-uv
        name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      # The merge ref's first parent is the base branch, so HEAD^1..HEAD is what merging the PR changes.
      - name: Match changed files
        id: gate
        shell: bash
        working-directory: repo
        run: uv run --no-project --python 3.12 "$RG/language-gate/language_gate.py" typescript HEAD^1 >> "$GITHUB_OUTPUT"

  checks:
    name: Checks
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 40
    env:
      RG: ${{ github.workspace }}/repo-guards/ci-checks
      BASE_REF: &base-ref ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.merge_group.base_sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || format('origin/{0}', github.event.repository.default_branch) }}
    defaults: &defaults
      run:
        shell: bash
        working-directory: repo/${{ inputs.working-directory }}
    steps:
      - &checkout
        name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 0
          persist-credentials: false
      - *checkout-repo-guards
      - *install-uv
      - &apply-overrides
        name: Apply caller overrides
        run: uv run --no-project --python 3.12 "$RG/config-overrides/config_overrides.py" apply "$GITHUB_WORKSPACE/repo-guards" "$GITHUB_WORKSPACE/repo/.github/checks/repo-guards.toml"
      - &install-node
        name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          package-manager-cache: false
      - &npmrc
        name: Apply the shared .npmrc
        run: |
          # Environment variables outrank the repo's own .npmrc.
          while IFS='=' read -r key value; do
            [[ -n "$key" ]] && echo "npm_config_${key//-/_}=$value" >> "$GITHUB_ENV"
          done < "$RG/typescript/.npmrc"
      - name: Install the shared tools
        run: |
          mkdir -p "$RUNNER_TEMP/ts-tools"
          cp "$RG/typescript/package.json" "$RUNNER_TEMP/ts-tools/"
          npm install --prefix "$RUNNER_TEMP/ts-tools" --no-audit --no-fund --save-exact license-checker-rseidelsohn@5.0.1
          npm ci --prefix "$RG/typescript/comment-budget" --no-audit --no-fund
          npm ci --prefix "$RG/typescript/layer-rules" --omit=dev --no-audit --no-fund
          echo "$RUNNER_TEMP/ts-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - &install-project
        name: Install the project
        run: npm ci --no-audit --no-fund
      - name: Inline exemptions
        id: inline-exemptions
        # The whole repo from its root, whatever working-directory is; UV_NO_CONFIG keeps the caller's uv config out.
        working-directory: repo
        env:
          UV_NO_CONFIG: "1"
        run: uv run --no-project --python 3.14 "$RG/inline-exemptions/inline_exemptions.py" typescript
      - name: Layer rules
        if: ${{ !cancelled() && steps.inline-exemptions.outcome == 'success' }}
        # The step parses the project's code and never runs it. uv looks the interpreter up from /: from the checkout, a
        # cold lookup runs the project's .venv python, and its .pth files with it. -I -S keeps site-packages out.
        working-directory: repo
        # Its own install dir: earlier uv steps run in the checkout and read the worker's uv config, which can add Python
        # builds to the shared one.
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/layer-rules-python
          PROJECT_DIR: ${{ inputs.working-directory }}
        run: |
          python=$(cd / && uv python install --no-config -q 3.14 && uv python find --no-config --managed-python 3.14)
          "$python" -I -S "$RG/layer-rules/layer_rules.py" typescript --working-directory "$PROJECT_DIR" --base "$BASE_REF"
      - name: Format
        if: ${{ !cancelled() && steps.inline-exemptions.outcome == 'success' }}
        run: uv run --no-project --python 3.12 "$RG/diff-filter/diff_filter.py" --base "$BASE_REF" --format paths -- prettier --list-different --config "$RG/typescript/.prettierrc.json" .
      - name: Comment budget
        if: ${{ !cancelled() && steps.inline-exemptions.outcome == 'success' }}
        run: node "$RG/typescript/comment-budget/comment-budget.ts" --base "$BASE_REF" --config "$RG/typescript/comment-budget.toml"
      - name: Type check
        if: ${{ !cancelled() && steps.inline-exemptions.outcome == 'success' }}
        run: |
          mapfile -t flags < <(node "$RG/typescript/workflow-config/workflow-config.ts" tsc-flags "$RG/typescript/tsconfig.json")
          uv run --no-project --python 3.12 "$RG/diff-filter/diff_filter.py" --base "$BASE_REF" --format tsc -- tsc --project tsconfig.json --noEmit --pretty false "${flags[@]}"
      - name: Dead code and unused dependencies
        if: ${{ !cancelled() && steps.inline-exemptions.outcome == 'success' }}
        run: uv run --no-project --python 3.12 "$RG/diff-filter/diff_filter.py" --base "$BASE_REF" --format knip -- knip --production --config "$RG/typescript/knip.json" --reporter json
      - name: Vulnerabilities
        if: ${{ !cancelled() && steps.inline-exemptions.outcome == 'success' }}
        run: npm audit
      - name: Dependency allowlist
        if: ${{ !cancelled() && steps.inline-exemptions.outcome == 'success' }}
        run: |
          base=$(git merge-base "$BASE_REF" HEAD)
          # No lock at the merge-base (a new project) leaves the base file absent: every package counts as new.
          if git cat-file -e "$base:./package-lock.json" 2>/dev/null; then git show "$base:./package-lock.json" > "$RUNNER_TEMP/base-package-lock.json"; fi
          uv run --no-project --python 3.12 "$RG/dependency-allowlist/dependency_allowlist.py" npm "$RG/dependency-allowlist/allowlist.toml" "$RUNNER_TEMP/base-package-lock.json" package-lock.json
      - name: Licenses
        if: ${{ !cancelled() && steps.inline-exemptions.outcome == 'success' }}
        run: |
          allowed=$(uv run --no-project --python 3.12 "$RG/config-overrides/config_overrides.py" get "$RG/licenses.toml" allow | paste -sd ';' -)
          exceptions=$(uv run --no-project --python 3.12 "$RG/config-overrides/config_overrides.py" get "$RG/licenses.toml" exceptions | paste -sd ';' -)
          args=(--onlyAllow "$allowed" --excludePrivatePackages)
          if [[ -n $exceptions ]]; then args+=(--excludePackages "$exceptions"); fi
          license-checker-rseidelsohn "${args[@]}"

  # The coverage steps run the PR's tests, so they get a job of their own.
  coverage:
    name: Coverage
    needs: [changes, coverage-shard]
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 40
    env:
      RG: ${{ github.workspace }}/repo-guards/ci-checks
      BASE_REF: *base-ref
      MODE: ${{ inputs.coverage-shards != '[]' && 'merge' || 'whole' }}
      SHARDS_RESULT: ${{ needs.coverage-shard.result }}
    defaults: *defaults
    steps:
      - *checkout
      - *checkout-repo-guards
      - *install-uv
      - *apply-overrides
      - *install-node
      - *npmrc
      - name: Install diff-cover
        working-directory: ${{ runner.temp }}
        run: |
          uv venv --python 3.12 coverage-venv
          uv pip install --python coverage-venv/bin/python --require-hashes -r "$RG/coverage/requirements.txt"
      - *install-project
      - name: Download shard reports
        if: ${{ needs.coverage-shard.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ needs.coverage-shard.outputs.artifact }}-*
          path: ${{ runner.temp }}/shards
          merge-multiple: true
      - &coverage
        name: Coverage
        id: coverage
        if: ${{ !cancelled() }}
        run: |
          if [[ $MODE == merge && $SHARDS_RESULT != success ]]; then
            echo "::error::a coverage shard failed ($SHARDS_RESULT)"
            exit 1
          fi
          flags=(--coverage.enabled=true --coverage.provider=v8 --coverage.reporter=cobertura)
          mapfile -t include < <(node "$RG/typescript/workflow-config/workflow-config.ts" coverage-include "$RG/typescript/knip.json")
          mapfile -t exclude < <(node "$RG/typescript/workflow-config/workflow-config.ts" coverage-exclude "$RG/typescript/coverage.json")
          for glob in "${include[@]}"; do flags+=("--coverage.include=$glob"); done
          for glob in "${exclude[@]}"; do flags+=("--coverage.exclude=$glob"); done
          report=--coverage.reportsDirectory="$RUNNER_TEMP/coverage-head"
          # Blob reports hold absolute paths and runners may check out to different directories:
          # shards store a placeholder for the checkout root, and merge puts its own back.
          root=/__repo_guards_checkout__
          swap() { node "$RG/typescript/workflow-config/workflow-config.ts" replace "$@"; }
          case $MODE in
            whole)
              npx --no-install vitest run "${flags[@]}" "$report" ;;
            shard)
              read -ra tests <<< "$TESTS"
              npx --no-install vitest run "${flags[@]}" --reporter=default --reporter=blob --outputFile.blob="$RUNNER_TEMP/shard/blob-$SHARD.json" "${tests[@]}"
              swap "$RUNNER_TEMP/shard/blob-$SHARD.json" "$PWD" "$root"
              # Artifact names are unique per run, and a caller may call this workflow once per working-directory.
              artifact=$(uv run --no-project --python 3.12 "$RG/coverage/shard_artifact.py" typescript "$PROJECT")
              echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
              exit ;;
            merge)
              for blob in "$RUNNER_TEMP"/shards/*.json; do swap "$blob" "$root" "$PWD"; done
              npx --no-install vitest run --merge-reports="$RUNNER_TEMP/shards" "${flags[@]}" "$report" ;;
          esac
          mv "$RUNNER_TEMP/coverage-head/cobertura-coverage.xml" "$RUNNER_TEMP/coverage-head.xml"
      - name: Coverage gate
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        run: |
          PATH="$RUNNER_TEMP/coverage-venv/bin:$PATH" python "$RG/coverage/coverage_gate.py" --config "$RG/coverage/coverage.toml" \
            --head "$RUNNER_TEMP/coverage-head.xml" --compare-branch "$BASE_REF"
      # Report only: lizard installs inside the step, and a failure anywhere leaves the job result unchanged.
      - name: CRAP report
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          if uv venv -q --no-config --clear --python 3.12 "$RUNNER_TEMP/crap-venv" \
            && uv pip install -q --no-config --python "$RUNNER_TEMP/crap-venv/bin/python" --require-hashes -r "$RG/crap/requirements.txt"; then
            "$RUNNER_TEMP/crap-venv/bin/python" "$RG/crap/crap_report.py" --coverage "$RUNNER_TEMP/coverage-head.xml"
          else
            echo "CRAP report skipped: lizard did not install" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  # One job per coverage-shards item, running only its test files; Coverage merges their reports.
  coverage-shard:
    name: Coverage shard ${{ matrix.tests }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' && inputs.coverage-shards != '[]' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 40
    outputs:
      artifact: ${{ steps.coverage.outputs.artifact }}
    strategy:
      fail-fast: false
      matrix:
        tests: ${{ fromJSON(inputs.coverage-shards) }}
    env:
      RG: ${{ github.workspace }}/repo-guards/ci-checks
      MODE: shard
      SHARD: ${{ strategy.job-index }}
      TESTS: ${{ matrix.tests }}
      PROJECT: ${{ inputs.working-directory }}
    defaults: *defaults
    steps:
      - *checkout
      - *checkout-repo-guards
      - *install-uv
      - *apply-overrides
      - *install-node
      - *npmrc
      - *install-project
      - *coverage
      - name: Upload shard report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.coverage.outputs.artifact }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/shard
          if-no-files-found: error
          retention-days: 1

  # Generating the snapshot builds the caller's code, so it gets a job of its own: read-only token, no secrets.
  api-snapshot:
    name: API snapshot
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      RG: ${{ github.workspace }}/repo-guards/ci-checks
      PROJECT_DIR: ${{ inputs.working-directory }}
      LANGUAGE: typescript
      # Keeps a uv.toml or [tool.uv] in the PR from choosing the Python that reads the setting.
      UV_NO_CONFIG: "1"
    defaults: *defaults
    steps:
      - *checkout
      - *checkout-repo-guards
      - *install-uv
      - name: Read the snapshot settings
        id: setting
        run: |
          snapshot=$(uv run --no-project --python 3.12 "$RG/config-overrides/config_overrides.py" snapshot-path "$GITHUB_WORKSPACE/repo" "$PROJECT_DIR" "$LANGUAGE")
          artifact=$(uv run --no-project --python 3.12 "$RG/api-snapshot/snapshot_artifact.py" "$LANGUAGE" "$PROJECT_DIR")
          # The summary line keeps the word the docs and the acceptance scenario look for: 未启用 (not enabled).
          if [[ -z $snapshot ]]; then
            echo "API snapshot: 未启用 (not enabled): repo-guards.toml sets no api-snapshot.$LANGUAGE for this working-directory" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "path=$snapshot" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      - name: Install Node
        if: ${{ steps.setting.outputs.path != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          package-manager-cache: false
      # The generator builds every package's tsconfig.json in memory and writes the public API entries of each
      # package.json exports or types entry to $RUNNER_TEMP/api-entries.json, only those in the repo-guards.toml api-snapshot-scope.typescript
      # it reads itself; a failed install, build, invalid scope or tool error exits 2 before Compare.
      # The shared .npmrc (ignore-scripts) also covers both installs, so no PR code runs here.
      - name: Generate
        if: ${{ steps.setting.outputs.path != '' }}
        run: |
          while IFS='=' read -r key value; do
            [[ -n "$key" ]] && export "npm_config_${key//-/_}=$value"
          done < "$RG/typescript/.npmrc"
          npm ci --prefix "$RG/typescript/api-snapshot" --no-audit --no-fund || exit 2
          npm ci --no-audit --no-fund || exit 2
          node "$RG/typescript/api-snapshot/api-snapshot.ts" --root "$GITHUB_WORKSPACE/repo" --working-directory "$PROJECT_DIR" \
            . "$RUNNER_TEMP/api-entries.json" || exit 2
      - name: Compare
        id: compare
        if: ${{ steps.setting.outputs.path != '' }}
        env:
          SNAPSHOT: ${{ steps.setting.outputs.path }}
          ARTIFACT: ${{ steps.setting.outputs.artifact }}
        run: |
          mkdir -p "$RUNNER_TEMP/api-snapshot"
          code=0
          uv run --no-project --python 3.12 "$RG/api-snapshot/api_snapshot.py" --entries "$RUNNER_TEMP/api-entries.json" \
            --snapshot "$GITHUB_WORKSPACE/repo/$SNAPSHOT" --output "$RUNNER_TEMP/api-snapshot/${SNAPSHOT##*/}" \
            --artifact "$ARTIFACT" --path "$SNAPSHOT" || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      # Exit 1: a mismatch or no snapshot file yet; the artifact holds the file to commit at the configured path.
      - name: Upload the new snapshot
        if: ${{ !cancelled() && steps.compare.outputs.code == '1' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.setting.outputs.artifact }}
          path: ${{ runner.temp }}/api-snapshot
          if-no-files-found: error

name: TypeScript checks

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner labels as JSON, e.g. '"ubuntu-latest"' or '["self-hosted","linux"]'
        type: string
        default: '"ubuntu-latest"'
      knip-entry:
        description: knip entry globs as JSON; a trailing ! marks shipped code
        type: string
        default: '["src/index.ts!"]'
      knip-project:
        description: knip project globs as JSON; a trailing ! marks shipped code, which coverage also measures
        type: string
        default: '["src/**/*.ts!"]'
      license-exceptions:
        description: The repo's packages exempt from the license check, one per line; may be absent
        type: string
        default: .github/checks/license-exceptions.txt
      jobs:
        description: "The jobs to run, one per line: '<job name>: <check> ...'; unlisted checks do not run. Empty: 'Checks: <every check but coverage>' and 'Coverage: coverage'"
        type: string
        default: ""
      coverage-shards:
        description: The number of coverage shards, 2 to 256, split by vitest --shard. Empty measures in one job
        type: string
        default: ""

permissions:
  contents: read

# Plan lays out the jobs from the caller's jobs and coverage-shards inputs; by default the fast checks share one job
# and coverage, which runs the tests, gets its own, in parallel.
# Steps shared by jobs are YAML anchors (&name) defined at first use and reused by alias (*name).
jobs:
  plan:
    name: Plan
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      coverage: ${{ steps.plan.outputs.coverage }}
      shards: ${{ steps.plan.outputs.shards }}
      artifact: ${{ steps.plan.outputs.artifact }}
    steps:
      # job.workflow_* is this file's repo and commit; the toJSON round trip hides it from actionlint 1.7.12, which lacks it.
      - &checkout-repo-guards
        name: Check out repo-guards at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          path: repo-guards
          persist-credentials: false
      - &install-uv
        name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      - name: Plan
        id: plan
        shell: bash
        env:
          JOBS: ${{ inputs.jobs }}
          SHARDS: ${{ inputs.coverage-shards }}
        run: uv run --no-project --python 3.12 repo-guards/ci-checks/job-plan/job_plan.py --language typescript

  checks:
    name: ${{ matrix.job.name }}
    needs: plan
    if: ${{ needs.plan.outputs.jobs != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 40
    env:
      RG: ${{ github.workspace }}/repo-guards/ci-checks
      BASE_REF: &base-ref ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.merge_group.base_sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || format('origin/{0}', github.event.repository.default_branch) }}
    defaults: &defaults
      run:
        shell: bash
        working-directory: repo
    steps:
      - &checkout
        name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 0
          persist-credentials: false
      - *checkout-repo-guards
      - *install-uv
      - &install-node
        name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          package-manager-cache: false
      - &npmrc
        name: Apply the shared .npmrc
        run: |
          # Environment variables outrank the repo's own .npmrc.
          while IFS='=' read -r key value; do
            [[ -n "$key" ]] && echo "npm_config_${key//-/_}=$value" >> "$GITHUB_ENV"
          done < "$RG/typescript/.npmrc"
      - name: Install the shared tools
        run: |
          mkdir -p "$RUNNER_TEMP/ts-tools"
          cp "$RG/typescript/package.json" "$RUNNER_TEMP/ts-tools/"
          npm install --prefix "$RUNNER_TEMP/ts-tools" --no-audit --no-fund --save-exact license-checker-rseidelsohn@5.0.1
          npm ci --prefix "$RG/typescript/comment-budget" --no-audit --no-fund
          echo "$RUNNER_TEMP/ts-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - &install-project
        name: Install the project
        run: npm ci --no-audit --no-fund
      - name: Format
        if: ${{ !cancelled() && contains(matrix.job.checks, 'format') }}
        run: uv run --no-project --python 3.12 "$RG/diff-filter/diff_filter.py" --base "$BASE_REF" --format paths -- prettier --list-different --config "$RG/typescript/.prettierrc.json" .
      - name: Comment budget
        if: ${{ !cancelled() && contains(matrix.job.checks, 'comment-budget') }}
        run: node "$RG/typescript/comment-budget/comment-budget.ts" --base "$BASE_REF" --config "$RG/typescript/comment-budget.toml"
      - name: Type check
        if: ${{ !cancelled() && contains(matrix.job.checks, 'type-check') }}
        run: |
          mapfile -t flags < <(node -e 'for (const [k, v] of Object.entries(require(process.argv[1]).compilerOptions)) console.log(`--${k}\n${v}`)' "$RG/typescript/tsconfig.json")
          uv run --no-project --python 3.12 "$RG/diff-filter/diff_filter.py" --base "$BASE_REF" --format tsc -- tsc --project tsconfig.json --noEmit --pretty false "${flags[@]}"
      - name: Dead code and unused dependencies
        if: ${{ !cancelled() && contains(matrix.job.checks, 'dead-code') }}
        env:
          ENTRY: ${{ inputs.knip-entry }}
          PROJECT: ${{ inputs.knip-project }}
        run: |
          node -e 'const [src, entry, project, out] = process.argv.slice(1); const c = require(src); c.entry = JSON.parse(entry); c.project = JSON.parse(project); require("fs").writeFileSync(out, JSON.stringify(c))' "$RG/typescript/knip.json" "$ENTRY" "$PROJECT" "$RUNNER_TEMP/knip.json"
          uv run --no-project --python 3.12 "$RG/diff-filter/diff_filter.py" --base "$BASE_REF" --format knip -- knip --production --config "$RUNNER_TEMP/knip.json" --reporter json
      - name: Vulnerabilities
        if: ${{ !cancelled() && contains(matrix.job.checks, 'vulnerabilities') }}
        run: npm audit
      - name: Licenses
        if: ${{ !cancelled() && contains(matrix.job.checks, 'licenses') }}
        env:
          EXCEPTIONS: ${{ inputs.license-exceptions }}
        run: |
          allowed=$(node -e 'const { parse } = require(require.resolve("smol-toml", { paths: [process.argv[1]] })); console.log(parse(require("fs").readFileSync(process.argv[2], "utf8")).allow.join(";"))' "$RG/typescript/comment-budget" "$RG/licenses.toml")
          args=(--onlyAllow "$allowed" --excludePrivatePackages)
          if [[ -f "$EXCEPTIONS" ]]; then
            args+=(--excludePackages "$({ grep -v '^[[:space:]]*$' "$EXCEPTIONS" || true; } | paste -sd ';' -)")
          fi
          license-checker-rseidelsohn "${args[@]}"

  # The coverage steps run the PR's tests, so they get jobs of their own.
  coverage-shard:
    name: ${{ needs.plan.outputs.coverage }} shard ${{ matrix.shard.name }}
    needs: plan
    if: ${{ needs.plan.outputs.shards != '[]' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      RG: ${{ github.workspace }}/repo-guards/ci-checks
      MODE: shard
      SHARD: ${{ matrix.shard.name }}
      PART: ${{ matrix.shard.shard }}
    defaults: *defaults
    steps:
      - *checkout
      - *checkout-repo-guards
      - *install-node
      - *npmrc
      - *install-project
      # MODE: whole measures and reports here; shard runs its part of the test files and keeps a blob report;
      # merge merges every shard's blob report and reports.
      - &coverage
        name: Coverage
        id: coverage
        if: ${{ !cancelled() }}
        env:
          PROJECT: ${{ inputs.knip-project }}
        run: |
          if [[ $MODE == merge && $SHARDS_RESULT != success ]]; then
            echo "::error::coverage shards did not all succeed ($SHARDS_RESULT)"
            exit 1
          fi
          flags=(--coverage.enabled=true --coverage.provider=v8 --coverage.reporter=cobertura)
          mapfile -t include < <(node -e 'for (const g of JSON.parse(process.argv[1])) if (g.endsWith("!")) console.log(g.slice(0, -1))' "$PROJECT")
          mapfile -t exclude < <(node -e 'for (const g of require(process.argv[1]).exclude) console.log(g)' "$RG/typescript/coverage.json")
          for glob in "${include[@]}"; do flags+=("--coverage.include=$glob"); done
          for glob in "${exclude[@]}"; do flags+=("--coverage.exclude=$glob"); done
          report=--coverage.reportsDirectory="$RUNNER_TEMP/coverage-head"
          # Blob reports hold absolute paths, and runners may check out to different directories: shards store a
          # placeholder for the checkout root, and merge puts its own back.
          root=/__repo_guards_checkout__
          swap() { node -e 'const fs = require("fs"); const [file, from, to] = process.argv.slice(1); fs.writeFileSync(file, fs.readFileSync(file, "utf8").split(from).join(to))' "$@"; }
          case $MODE in
            whole)
              npx --no-install vitest run "${flags[@]}" "$report" ;;
            shard)
              npx --no-install vitest run "${flags[@]}" --shard="$PART" --reporter=default --reporter=blob --outputFile.blob="$RUNNER_TEMP/shard/blob-$SHARD.json"
              swap "$RUNNER_TEMP/shard/blob-$SHARD.json" "$PWD" "$root"
              exit ;;
            merge)
              for blob in "$RUNNER_TEMP"/shards/*.json; do swap "$blob" "$root" "$PWD"; done
              npx --no-install vitest run --merge-reports="$RUNNER_TEMP/shards" "${flags[@]}" "$report" ;;
          esac
          mv "$RUNNER_TEMP/coverage-head/cobertura-coverage.xml" "$RUNNER_TEMP/coverage-head.xml"
      - name: Upload shard report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.plan.outputs.artifact }}-${{ matrix.shard.name }}
          path: ${{ runner.temp }}/shard
          if-no-files-found: error
          retention-days: 1

  # Without shards, measures in one job; with them, merges the shards' reports. Fails when a shard did.
  coverage:
    name: ${{ needs.plan.outputs.coverage }}
    needs: [plan, coverage-shard]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.coverage != '' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 40
    env:
      RG: ${{ github.workspace }}/repo-guards/ci-checks
      BASE_REF: *base-ref
      MODE: ${{ needs.plan.outputs.shards != '[]' && 'merge' || 'whole' }}
      SHARDS_RESULT: ${{ needs.coverage-shard.result }}
    defaults: *defaults
    steps:
      - *checkout
      - *checkout-repo-guards
      - *install-uv
      - *install-node
      - *npmrc
      - name: Install diff-cover
        working-directory: ${{ runner.temp }}
        run: |
          uv venv --python 3.12 coverage-venv
          uv pip install --python coverage-venv/bin/python --require-hashes -r "$RG/coverage/requirements.txt"
      - *install-project
      - name: Download shard reports
        if: ${{ needs.coverage-shard.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ needs.plan.outputs.artifact }}-*
          path: ${{ runner.temp }}/shards
          merge-multiple: true
      - *coverage
      - name: Coverage gate
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        run: |
          PATH="$RUNNER_TEMP/coverage-venv/bin:$PATH" python "$RG/coverage/coverage_gate.py" --config "$RG/coverage/coverage.toml" \
            --head "$RUNNER_TEMP/coverage-head.xml" --compare-branch "$BASE_REF"
      # Report only: lizard installs inside the step, and a failure anywhere leaves the job result unchanged.
      - name: CRAP report
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          if uv venv -q --no-config --clear --python 3.12 "$RUNNER_TEMP/crap-venv" \
            && uv pip install -q --no-config --python "$RUNNER_TEMP/crap-venv/bin/python" --require-hashes -r "$RG/crap/requirements.txt"; then
            "$RUNNER_TEMP/crap-venv/bin/python" "$RG/crap/crap_report.py" --coverage "$RUNNER_TEMP/coverage-head.xml"
          else
            echo "CRAP report skipped: lizard did not install" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

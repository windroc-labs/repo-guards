name: Python checks

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner labels as JSON, e.g. '"ubuntu-latest"' or '["self-hosted","linux"]'
        type: string
        default: '"ubuntu-latest"'
      working-directory:
        description: The project's directory, relative to the repo root
        type: string
        default: .
      source-dirs:
        description: Shipped source directories, space-separated, for pyright, vulture and coverage
        type: string
        default: src
      requirements:
        description: Requirement files, space-separated, relative to working-directory; used when the project has no uv.lock
        type: string
        default: requirements.txt
      requirements-dev:
        description: Development requirement files (tests), installed when present and known to deptry as dev; used when the project has no uv.lock
        type: string
        default: requirements-dev.txt
      deny-allowlist:
        description: The repo's dependency allowlist, the same file for every language; may be absent
        type: string
        default: .github/checks/deny-allowlist.toml
      license-exceptions:
        description: The repo's packages exempt from the license check, one name per line; may be absent
        type: string
        default: .github/checks/license-exceptions.txt

permissions:
  contents: read

# Fast checks share one job; only the coverage run, which runs the tests twice, gets its own, in parallel.
# Steps shared by jobs are YAML anchors (&name) defined at first use and reused by alias (*name).
jobs:
  checks:
    name: Checks
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 40
    env:
      RG: ${{ github.workspace }}/repo-guards/ci-checks
      BASE_REF: &base-ref ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.merge_group.base_sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || format('origin/{0}', github.event.repository.default_branch) }}
      SOURCE_DIRS: ${{ inputs.source-dirs }}
      ALLOWLIST: ${{ github.workspace }}/repo/${{ inputs.deny-allowlist }}
      REQUIREMENTS: ${{ inputs.requirements }}
      REQUIREMENTS_DEV: ${{ inputs.requirements-dev }}
      UV_NO_BUILD: "1"
    defaults: &defaults
      run:
        shell: bash
        working-directory: repo/${{ inputs.working-directory }}
    steps:
      - &checkout
        name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 0
          persist-credentials: false
      # job.workflow_* is this file's repo and commit; the toJSON round trip hides it from actionlint 1.7.12, which lacks it.
      - &checkout-repo-guards
        name: Check out repo-guards at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          path: repo-guards
          persist-credentials: false
      - &install-uv
        name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      # The allowlist's build entries are the only packages uv may build from source.
      - &allowlist
        name: Apply the dependency allowlist
        run: uv run --no-project --python 3.12 "$RG/allowlist/allowlist.py" env python --allowlist "$ALLOWLIST" >> "$GITHUB_ENV"
      - name: Install the shared dev group
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/tools"
          uv pip install --python "$RUNNER_TEMP/tools" --group "$RG/python/pyproject.toml:dev" pip-audit==2.10.1 pip-licenses==5.5.5
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      # Before install. Without uv.lock, the requirement files' own git lines are checked before resolving clones them.
      - &dependency-rules
        name: Dependency rules
        id: dependency-rules
        run: |
          check=(uv run --no-project --python 3.12 "$RG/allowlist/allowlist.py" check python --allowlist "$ALLOWLIST")
          if [[ -f uv.lock ]]; then
            "${check[@]}" --uv-lock uv.lock
          else
            read -ra files <<< "$REQUIREMENTS $REQUIREMENTS_DEV"
            "${check[@]}" --declared "${files[@]}"
            bash "$RG/python/install-project.sh" resolve "$RUNNER_TEMP/resolved.txt"
            "${check[@]}" --requirements "$RUNNER_TEMP/resolved.txt"
          fi
      - name: Install the project
        run: bash "$RG/python/install-project.sh" sync "$RUNNER_TEMP/resolved.txt"
      - name: Format
        if: ${{ !cancelled() }}
        run: python3 "$RG/diff-filter/diff_filter.py" --base "$BASE_REF" --format ruff-format -- ruff format --check --output-format json --config "$RG/python/pyproject.toml" .
      - name: Lint
        if: ${{ !cancelled() }}
        run: python3 "$RG/diff-filter/diff_filter.py" --base "$BASE_REF" --format ruff -- ruff check --output-format json --config "$RG/python/pyproject.toml" .
      - name: Comment budget
        if: ${{ !cancelled() }}
        run: python3 "$RG/python/comment-budget/comment_budget.py" --base "$BASE_REF" --config "$RG/python/comment-budget.toml"
      - name: Type check
        if: ${{ !cancelled() }}
        run: |
          # pyright roots imports at its config's folder, so the shared settings go into a config that points at the repo.
          python3 -c 'import json, sys, tomllib, pathlib; c = tomllib.load(open(sys.argv[1], "rb"))["tool"]["pyright"]; c["extraPaths"] = [str(pathlib.Path(d).resolve()) for d in sys.argv[3:]]; pathlib.Path(sys.argv[2]).write_text(json.dumps(c))' "$RG/python/pyproject.toml" "$RUNNER_TEMP/pyrightconfig.json" $SOURCE_DIRS
          python3 "$RG/diff-filter/diff_filter.py" --base "$BASE_REF" --format pyright -- pyright --outputjson --project "$RUNNER_TEMP/pyrightconfig.json" --pythonpath .venv/bin/python $SOURCE_DIRS
      - name: Dead code
        if: ${{ !cancelled() }}
        run: python3 "$RG/diff-filter/diff_filter.py" --base "$BASE_REF" --format vulture -- vulture --config "$RG/python/pyproject.toml" $SOURCE_DIRS
      - name: Unused dependencies
        if: ${{ !cancelled() }}
        run: |
          deptry=$(python3 -c 'import sys, tomllib; print(next(r for r in tomllib.load(open(sys.argv[1], "rb"))["dependency-groups"]["dev"] if r.startswith("deptry==")))' "$RG/python/pyproject.toml")
          files=()
          if [[ ! -f uv.lock ]]; then
            files=(--requirements-files "${REQUIREMENTS// /,}" --requirements-files-dev "${REQUIREMENTS_DEV// /,}")
          fi
          uv run --no-project --python .venv/bin/python --with "$deptry" deptry "${files[@]}" $SOURCE_DIRS
      # What .venv installed, as name==version lines; git and URL installs (name @ url) have no advisories.
      - name: Vulnerabilities
        if: ${{ !cancelled() }}
        run: |
          uv pip freeze --python .venv/bin/python --exclude-editable > "$RUNNER_TEMP/installed.txt"
          grep -E '^[A-Za-z0-9._-]+==' "$RUNNER_TEMP/installed.txt" > "$RUNNER_TEMP/pinned.txt" || true
          pip-audit --requirement "$RUNNER_TEMP/pinned.txt" --disable-pip --no-deps
      - name: Licenses
        if: ${{ !cancelled() }}
        env:
          EXCEPTIONS: ${{ inputs.license-exceptions }}
        run: |
          ignore=("$(python3 -c 'import os, tomllib; print(os.path.exists("pyproject.toml") and tomllib.load(open("pyproject.toml", "rb")).get("project", {}).get("name", "") or "")')")
          if [[ -f "$GITHUB_WORKSPACE/repo/$EXCEPTIONS" ]]; then
            mapfile -t -O 1 ignore < <(grep -v '^[[:space:]]*$' "$GITHUB_WORKSPACE/repo/$EXCEPTIONS")
          fi
          pip-licenses --python .venv/bin/python --from all --format json --ignore-packages "${ignore[@]}" > "$RUNNER_TEMP/licenses.json"
          python3 "$RG/python/license-check/license_check.py" "$RG/licenses.toml" "$RUNNER_TEMP/licenses.json" "$ALLOWLIST"

  # The coverage steps run the PR's tests, so they get a job of their own.
  coverage:
    name: Coverage
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 40
    env:
      RG: ${{ github.workspace }}/repo-guards/ci-checks
      BASE_REF: *base-ref
      SOURCE_DIRS: ${{ inputs.source-dirs }}
      ALLOWLIST: ${{ github.workspace }}/repo/${{ inputs.deny-allowlist }}
      REQUIREMENTS: ${{ inputs.requirements }}
      REQUIREMENTS_DEV: ${{ inputs.requirements-dev }}
      UV_NO_BUILD: "1"
    defaults: *defaults
    steps:
      - *checkout
      - *checkout-repo-guards
      - *install-uv
      - *allowlist
      - *dependency-rules
      # The Coverage step reads TOML with python3, which needs 3.11 or later; this job skips the dev group.
      - name: Install Python 3.12
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - name: Install diff-cover
        working-directory: ${{ runner.temp }}
        run: |
          uv venv --python 3.12 coverage-venv
          uv pip install --python coverage-venv/bin/python --require-hashes -r "$RG/coverage/requirements.txt"
      - name: Coverage
        id: coverage
        if: ${{ !cancelled() && steps.dependency-rules.outcome == 'success' }}
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PROJECT_DIR: ${{ inputs.working-directory }}
        run: |
          coverage=$(python3 -c 'import sys, tomllib; print(next(r for r in tomllib.load(open(sys.argv[1], "rb"))["dependency-groups"]["dev"] if r.startswith("coverage[toml]==")))' "$RG/python/pyproject.toml")
          read -ra dirs <<< "$SOURCE_DIRS"
          sources=$(IFS=,; echo "${dirs[*]}")
          # $3: the resolution to install; the PR's is the one Dependency rules checked, the merge-base's is resolved here.
          measure() {
            (cd "$1" && { [[ -f $3 ]] || bash "$RG/python/install-project.sh" resolve "$3"; } \
              && bash "$RG/python/install-project.sh" sync "$3" \
              && uv run --no-project --python .venv/bin/python --with "$coverage" coverage run --rcfile "$RG/python/pyproject.toml" --source "$sources" -m pytest \
              && uv run --no-project --python .venv/bin/python --with "$coverage" coverage xml --rcfile "$RG/python/pyproject.toml" -o "$2")
          }
          # A self-hosted runner keeps repo/.git but empties RUNNER_TEMP: drop the last job's stale registration.
          git worktree prune
          git worktree add --detach "$RUNNER_TEMP/base" "$(git merge-base "$BASE_REF" HEAD)"
          measure "$RUNNER_TEMP/base/$PROJECT_DIR" "$RUNNER_TEMP/coverage-base.xml" "$RUNNER_TEMP/resolved-base.txt" || echo "::warning::Tests at the merge-base failed"
          measure . "$RUNNER_TEMP/coverage-head.xml" "$RUNNER_TEMP/resolved.txt"
      - name: Coverage gate
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        run: |
          PATH="$RUNNER_TEMP/coverage-venv/bin:$PATH" python "$RG/coverage/coverage_gate.py" --config "$RG/coverage/coverage.toml" \
            --head "$RUNNER_TEMP/coverage-head.xml" --base "$RUNNER_TEMP/coverage-base.xml" --compare-branch "$BASE_REF"
      # Report only: lizard installs inside the step, and a failure anywhere leaves the job result unchanged.
      - name: CRAP report
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          if uv venv -q --no-config --clear --python 3.12 "$RUNNER_TEMP/crap-venv" \
            && uv pip install -q --no-config --python "$RUNNER_TEMP/crap-venv/bin/python" --require-hashes -r "$RG/crap/requirements.txt"; then
            "$RUNNER_TEMP/crap-venv/bin/python" "$RG/crap/crap_report.py" --coverage "$RUNNER_TEMP/coverage-head.xml"
          else
            echo "CRAP report skipped: lizard did not install" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

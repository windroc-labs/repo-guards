name: Python checks

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner labels as JSON, e.g. '"ubuntu-latest"' or '["self-hosted","linux"]'
        type: string
        default: '"ubuntu-latest"'
      working-directory:
        description: The project's directory, relative to the repo root
        type: string
        default: .
      source-dirs:
        description: Shipped source directories, space-separated, for pyright, vulture and coverage
        type: string
        default: src
      license-exceptions:
        description: The repo's packages exempt from the license check, one name per line; may be absent
        type: string
        default: .github/checks/license-exceptions.txt
      coverage-shards:
        description: Coverage shards as a JSON list, each one parallel job's pytest test paths, space-separated; [] measures in one job
        type: string
        default: "[]"

permissions:
  contents: read

# Fast checks share one job; only the coverage run, which runs the tests, gets its own, in parallel.
# Steps shared by jobs are YAML anchors (&name) defined at first use and reused by alias (*name).
jobs:
  checks:
    name: Checks
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 40
    env:
      RG: ${{ github.workspace }}/repo-guards/ci-checks
      BASE_REF: &base-ref ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.merge_group.base_sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || format('origin/{0}', github.event.repository.default_branch) }}
      SOURCE_DIRS: ${{ inputs.source-dirs }}
      UV_NO_BUILD: "1"
    defaults: &defaults
      run:
        shell: bash
        working-directory: repo/${{ inputs.working-directory }}
    steps:
      - &checkout
        name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 0
          persist-credentials: false
      # job.workflow_* is this file's repo and commit; the toJSON round trip hides it from actionlint 1.7.12, which lacks it.
      - &checkout-repo-guards
        name: Check out repo-guards at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          path: repo-guards
          persist-credentials: false
      - &install-uv
        name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      - &apply-overrides
        name: Apply caller overrides
        run: uv run --no-project --python 3.12 "$RG/config-overrides/config_overrides.py" apply "$GITHUB_WORKSPACE/repo-guards" "$GITHUB_WORKSPACE/repo/.github/checks/repo-guards.toml"
      - name: Install the shared dev group
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/tools"
          uv pip install --python "$RUNNER_TEMP/tools" --group "$RG/python/pyproject.toml:dev" pip-audit==2.10.1 pip-licenses==5.5.5
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - name: Install the project
        run: |
          if [[ -f uv.lock ]]; then
            uv sync --locked
          else
            uv venv .venv
            uv pip install --python .venv/bin/python -r requirements.txt
          fi
      - name: Export the resolved dependencies
        env:
          PROJECT_DIR: ${{ inputs.working-directory }}
        run: |
          # pylock.toml (for pip-audit) and dependencies.toml (for the allowlist: uv.lock itself, which lists every extra and
          # group, else the compiled pylock.toml); a merge-base without uv.lock or requirements.txt leaves no base files.
          python=$PWD/.venv/bin/python
          export_lock() {
            if [[ -f $1/uv.lock ]]; then
              (cd "$1" && uv export -q --frozen --format pylock.toml --no-emit-workspace -o "$2/pylock.toml")
              cp "$1/uv.lock" "$2/dependencies.toml"
            elif [[ -f $1/requirements.txt ]]; then
              (cd "$1" && uv pip compile -q requirements.txt --universal --python "$python" --format pylock.toml -o "$2/pylock.toml")
              cp "$2/pylock.toml" "$2/dependencies.toml"
            fi
          }
          mkdir -p "$RUNNER_TEMP/pylock-head" "$RUNNER_TEMP/pylock-base"
          export_lock . "$RUNNER_TEMP/pylock-head"
          git worktree prune
          git worktree add -q --detach "$RUNNER_TEMP/allowlist-base" "$(git merge-base "$BASE_REF" HEAD)"
          export_lock "$RUNNER_TEMP/allowlist-base/$PROJECT_DIR" "$RUNNER_TEMP/pylock-base"
      - name: Format
        if: ${{ !cancelled() }}
        run: python3 "$RG/diff-filter/diff_filter.py" --base "$BASE_REF" --format ruff-format -- ruff format --check --output-format json --config "$RG/python/pyproject.toml" .
      - name: Lint
        if: ${{ !cancelled() }}
        run: python3 "$RG/diff-filter/diff_filter.py" --base "$BASE_REF" --format ruff -- ruff check --output-format json --config "$RG/python/pyproject.toml" .
      - name: Comment budget
        if: ${{ !cancelled() }}
        run: python3 "$RG/python/comment-budget/comment_budget.py" --base "$BASE_REF" --config "$RG/python/comment-budget.toml"
      - name: Type check
        if: ${{ !cancelled() }}
        run: |
          # pyright roots imports at its config's folder, so the shared settings go into a config that points at the repo.
          python3 "$RG/python/pyproject-config/pyproject_config.py" pyright-config "$RG/python/pyproject.toml" "$RUNNER_TEMP/pyrightconfig.json" $SOURCE_DIRS
          python3 "$RG/diff-filter/diff_filter.py" --base "$BASE_REF" --format pyright -- pyright --outputjson --project "$RUNNER_TEMP/pyrightconfig.json" --pythonpath .venv/bin/python $SOURCE_DIRS
      - name: Dead code
        if: ${{ !cancelled() }}
        run: python3 "$RG/diff-filter/diff_filter.py" --base "$BASE_REF" --format vulture -- vulture --config "$RG/python/pyproject.toml" $SOURCE_DIRS
      - name: Unused dependencies
        if: ${{ !cancelled() }}
        run: |
          deptry=$(python3 "$RG/python/pyproject-config/pyproject_config.py" pin "$RG/python/pyproject.toml" "deptry==")
          uv run --no-project --python .venv/bin/python --with "$deptry" deptry $SOURCE_DIRS
      - name: Vulnerabilities
        if: ${{ !cancelled() }}
        run: pip-audit --locked "$RUNNER_TEMP/pylock-head"
      - name: Dependency allowlist
        if: ${{ !cancelled() }}
        run: python3 "$RG/dependency-allowlist/dependency_allowlist.py" python "$RG/dependency-allowlist/allowlist.toml" "$RUNNER_TEMP/pylock-base/dependencies.toml" "$RUNNER_TEMP/pylock-head/dependencies.toml"
      - name: Licenses
        if: ${{ !cancelled() }}
        env:
          EXCEPTIONS: ${{ inputs.license-exceptions }}
        run: |
          # The project itself is installed only from a pyproject.toml.
          ignore=()
          if [[ -f pyproject.toml ]]; then
            ignore+=("$(python3 "$RG/python/pyproject-config/pyproject_config.py" project-name pyproject.toml)")
          fi
          if [[ -f "$GITHUB_WORKSPACE/repo/$EXCEPTIONS" ]]; then
            mapfile -t -O "${#ignore[@]}" ignore < <(grep -v '^[[:space:]]*$' "$GITHUB_WORKSPACE/repo/$EXCEPTIONS")
          fi
          args=(--python .venv/bin/python --from all --format json)
          if (( ${#ignore[@]} )); then args+=(--ignore-packages "${ignore[@]}"); fi
          pip-licenses "${args[@]}" > "$RUNNER_TEMP/licenses.json"
          python3 "$RG/python/license-check/license_check.py" "$RG/licenses.toml" "$RUNNER_TEMP/licenses.json"

  # The coverage steps run the PR's tests, so they get a job of their own.
  coverage:
    name: Coverage
    needs: coverage-shard
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 40
    env:
      RG: ${{ github.workspace }}/repo-guards/ci-checks
      BASE_REF: *base-ref
      SOURCE_DIRS: ${{ inputs.source-dirs }}
      UV_NO_BUILD: "1"
      MODE: ${{ inputs.coverage-shards != '[]' && 'merge' || 'whole' }}
      SHARDS_RESULT: ${{ needs.coverage-shard.result }}
    defaults: *defaults
    steps:
      - *checkout
      - *checkout-repo-guards
      - *install-uv
      - *apply-overrides
      # The Coverage step reads TOML with python3, which needs 3.11 or later; this job skips the dev group.
      - &install-python
        name: Install Python 3.12
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - name: Install diff-cover
        working-directory: ${{ runner.temp }}
        run: |
          uv venv --python 3.12 coverage-venv
          uv pip install --python coverage-venv/bin/python --require-hashes -r "$RG/coverage/requirements.txt"
      - name: Download shard data
        if: ${{ needs.coverage-shard.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ needs.coverage-shard.outputs.artifact }}-*
          path: ${{ runner.temp }}/shards
          merge-multiple: true
      - &coverage
        name: Coverage
        id: coverage
        if: ${{ !cancelled() }}
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          pin() { python3 "$RG/python/pyproject-config/pyproject_config.py" pin "$RG/python/pyproject.toml" "$1"; }
          coverage=$(pin "coverage[toml]==")
          pytest=$(pin "pytest==")
          read -ra dirs <<< "$SOURCE_DIRS"
          sources=$(IFS=,; echo "${dirs[*]}")
          if [[ $MODE == merge && $SHARDS_RESULT != success ]]; then
            echo "::error::a coverage shard failed ($SHARDS_RESULT)"
            exit 1
          fi
          # Every mode uses the project's environment: its Python version decides which lines and branches count.
          # A uv project's pytest comes from its lock; a requirements.txt project without one gets the shared dev group's.
          tools=(--with "$coverage")
          if [[ -f uv.lock ]]; then
            uv sync --locked
          else
            uv venv .venv && uv pip install --python .venv/bin/python -r requirements.txt
            uv pip show -q --python .venv/bin/python pytest > /dev/null 2>&1 || tools+=(--with "$pytest")
          fi
          cov() { uv run --no-project --python .venv/bin/python "${tools[@]}" coverage "$1" --rcfile "$RG/python/pyproject.toml" "${@:2}"; }
          case $MODE in
            whole)
              cov run --source "$sources" -m pytest ;;
            shard)
              read -ra tests <<< "$TESTS"
              mkdir -p "$RUNNER_TEMP/shard"
              cov run --source "$sources" --data-file "$RUNNER_TEMP/shard/$SHARD.coverage" -m pytest "${tests[@]}"
              # Artifact names are unique per run, and a caller may call this workflow once per working-directory.
              artifact=$(python3 "$RG/coverage/shard_artifact.py" python "$PROJECT")
              echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
              exit ;;
            merge)
              cov combine "$RUNNER_TEMP"/shards/*.coverage ;;
          esac
          cov xml -o "$RUNNER_TEMP/coverage-head.xml"
      - name: Coverage gate
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        run: |
          PATH="$RUNNER_TEMP/coverage-venv/bin:$PATH" python "$RG/coverage/coverage_gate.py" --config "$RG/coverage/coverage.toml" \
            --head "$RUNNER_TEMP/coverage-head.xml" --compare-branch "$BASE_REF"
      # Report only: lizard installs inside the step, and a failure anywhere leaves the job result unchanged.
      - name: CRAP report
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          if uv venv -q --no-config --clear --python 3.12 "$RUNNER_TEMP/crap-venv" \
            && uv pip install -q --no-config --python "$RUNNER_TEMP/crap-venv/bin/python" --require-hashes -r "$RG/crap/requirements.txt"; then
            "$RUNNER_TEMP/crap-venv/bin/python" "$RG/crap/crap_report.py" --coverage "$RUNNER_TEMP/coverage-head.xml"
          else
            echo "CRAP report skipped: lizard did not install" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  # One job per coverage-shards item, running only its test paths; Coverage combines their data.
  coverage-shard:
    name: Coverage shard ${{ matrix.tests }}
    if: ${{ inputs.coverage-shards != '[]' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 40
    outputs:
      artifact: ${{ steps.coverage.outputs.artifact }}
    strategy:
      fail-fast: false
      matrix:
        tests: ${{ fromJSON(inputs.coverage-shards) }}
    env:
      RG: ${{ github.workspace }}/repo-guards/ci-checks
      SOURCE_DIRS: ${{ inputs.source-dirs }}
      UV_NO_BUILD: "1"
      MODE: shard
      SHARD: ${{ strategy.job-index }}
      TESTS: ${{ matrix.tests }}
      PROJECT: ${{ inputs.working-directory }}
    defaults: *defaults
    steps:
      - *checkout
      - *checkout-repo-guards
      - *install-uv
      - *apply-overrides
      - *install-python
      - *coverage
      - name: Upload shard data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.coverage.outputs.artifact }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/shard
          if-no-files-found: error
          retention-days: 1

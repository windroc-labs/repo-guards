name: guard
on:
  pull_request:
permissions:
  actions: read
  contents: read
  pull-requests: read
jobs:
  guard:
    name: guard
    if: github.repository != 'windroc-labs/repo-guards'
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux"]') || 'ubuntu-latest' }}
    timeout-minutes: 65
    steps:
      - name: Require a successful ci.yml run for this PR head
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            const self = `${owner}/${repo}`;
            const prNumber = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha;
            const headRef = context.payload.pull_request.head.ref;
            const prCreated = Date.parse(context.payload.pull_request.created_at);
            const defaultBranch = context.payload.repository.default_branch;
            const workflow = '.github/workflows/ci.yml';
            const waitSeconds = 3600;
            const pollSeconds = 20;

            // Returns a failure message, or null.
            async function blocker() {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
              if (pr.head.repo?.full_name !== self) return 'fork PRs are not supported; push the branch to this repository and open the PR from it';
              // A re-run reuses the original event, whose base may predate a retarget.
              const bases = [pr.base.ref, context.payload.pull_request.base.ref];
              if (bases.some(b => b !== defaultBranch)) return `base ${bases.join(' / ')} is not the default branch ${defaultBranch}`;
              if (pr.head.sha !== sha) return 'PR head moved; the newer guard run decides';
              // Retargeting starts no guard run, and runs report the PR's current base, not the one they ran on.
              // Docs list these events under issue events, not timeline events; read both.
              const opts = { owner, repo, issue_number: prNumber, per_page: 100 };
              const events = [
                ...await github.paginate(github.rest.issues.listEvents, opts),
                ...await github.paginate(github.rest.issues.listEventsForTimeline, opts),
              ];
              const baseChanges = ['base_ref_changed', 'automatic_base_change_succeeded', 'automatic_base_change_failed'];
              if (events.some(e => baseChanges.includes(e.event))) return 'the base branch of this PR was changed; push this work to a new branch and open a new PR';
              // Runs are matched by head branch + sha and list PRs as of query time, so a branch that
              // ever backed another PR (at any sha) can carry that PR's runs.
              const sameHead = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'all', head: `${owner}:${headRef}`, per_page: 100,
              });
              const others = sameHead.filter(p => p.number !== prNumber && p.head.repo?.full_name === self).map(p => p.number);
              if (others.length) return `branch ${headRef} was used by PR(s) [${others.join(', ')}]; push this work to a new branch and open a new PR`;
              return null;
            }

            // Returns true to pass, a failure message, or null to keep waiting.
            async function poll() {
              const all = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner, repo, event: 'pull_request', head_sha: sha, per_page: 100,
              });
              // Filtered run queries stop at 1000 results, which could hide a failed run.
              if (all.length >= 1000) return 'too many workflow runs on this head; push a new commit';
              const runs = all.filter(r =>
                r.path === workflow && r.event === 'pull_request' && r.head_sha === sha
                && r.head_branch === headRef && r.head_repository?.full_name === self
                && Date.parse(r.created_at) >= prCreated
                && r.pull_requests.some(p => p.number === prNumber && p.base.ref === defaultBranch));
              for (const r of runs) core.info(`${r.html_url} ${r.status} ${r.conclusion}`);
              if (runs.some(r => r.status === 'completed' && r.conclusion !== 'success')) return 'ci.yml did not succeed';
              if (runs.length === 0 || runs.some(r => r.status !== 'completed')) return null;
              return (await blocker()) ?? true;
            }

            const early = await blocker();
            if (early) return core.setFailed(early);
            try {
              await github.rest.repos.getContent({ owner, repo, path: workflow, ref: sha });
            } catch (e) {
              if (e.status === 404) return core.setFailed(`${workflow} not found at ${sha}`);
              throw e;
            }

            const deadline = Date.now() + waitSeconds * 1000;
            while (true) {
              try {
                const verdict = await poll();
                if (verdict === true) return core.info('ci.yml succeeded');
                if (verdict) return core.setFailed(verdict);
              } catch (e) {
                if ([401, 404, 422].includes(e.status)) throw e;
                core.warning(`poll failed, retrying: ${e.message}`);
              }
              if (Date.now() >= deadline) return core.setFailed(`no completed ci.yml run within ${waitSeconds}s`);
              await new Promise(resolve => setTimeout(resolve, pollSeconds * 1000));
            }

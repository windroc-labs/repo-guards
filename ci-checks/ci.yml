name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  github-dir-pr:
    uses: windroc-labs/repo-guards/.github/workflows/github-dir-pr.yml@main
  rust:
    uses: windroc-labs/repo-guards/.github/workflows/rust.yml@main
    with:
      runs-on: '"ubuntu-latest"'
      working-directory: .
      unit-tests: --lib --bins
  python:
    uses: windroc-labs/repo-guards/.github/workflows/python.yml@main
    with:
      runs-on: '["self-hosted","linux"]'
  typescript:
    uses: windroc-labs/repo-guards/.github/workflows/typescript.yml@main
    with:
      working-directory: .
  go:
    uses: windroc-labs/repo-guards/.github/workflows/go.yml@main
    with:
      working-directory: .
      unit-tests: ./...
  jscpd:
    uses: windroc-labs/repo-guards/.github/workflows/jscpd.yml@main
  inline-exemptions:
    uses: windroc-labs/repo-guards/.github/workflows/inline-exemptions.yml@main

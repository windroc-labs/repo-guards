name: Rust checks

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner labels as JSON, e.g. '"ubuntu-latest"' or '["self-hosted","linux"]'
        type: string
        default: '"ubuntu-latest"'
      deny-allowlist:
        description: The repo's cargo-deny allowlist, merged into the shared deny.toml
        type: string
        default: .github/checks/deny-allowlist.toml

permissions:
  contents: read

jobs:
  static:
    name: Rust static
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 20
    env:
      RG: ${{ github.workspace }}/repo-guards/ci-checks
      BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.merge_group.base_sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || format('origin/{0}', github.event.repository.default_branch) }}
      CARGO_TERM_COLOR: always
      CARGO_BUILD_RUSTC_WRAPPER: ""
      CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER: ""
      RUSTC_WRAPPER: ""
      RUSTC_WORKSPACE_WRAPPER: ""
      CARGO_ENCODED_RUSTFLAGS: -Dwarnings
    defaults:
      run:
        shell: bash
        working-directory: repo
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 0
          persist-credentials: false
      # job.workflow_* is this file's repo and commit; the toJSON round trip hides it from actionlint 1.7.12, which lacks it.
      - &checkout-repo-guards
        name: Check out repo-guards at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          path: repo-guards
          persist-credentials: false
      - &install-rust
        name: Install Rust from the shared rust-toolchain.toml
        working-directory: ${{ runner.temp }}
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' "$RG/rust/rust-toolchain.toml")
          if ! command -v rustup >/dev/null; then
            arch=$(uname -m)
            case "$arch" in
              x86_64) sum=b1c8cb14e30889e7e2999e6b69e62d9e9b9ffc0f4df8180564d306d9680e6c55 ;;
              aarch64) sum=9f608c142e0e38a78957d0661ba1dfaf0b6fb37184cfaa4b9a0aa57af6184282 ;;
              *) echo "::error::no pinned rustup-init for $arch"; exit 1 ;;
            esac
            curl --proto '=https' --tlsv1.2 -sSfo rustup-init "https://static.rust-lang.org/rustup/archive/1.29.3/$arch-unknown-linux-gnu/rustup-init"
            echo "$sum  rustup-init" | sha256sum -c -
            chmod +x rustup-init
            ./rustup-init -y --profile minimal --default-toolchain none --no-modify-path
            rm -f rustup-init
            echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
            export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH"
          fi
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      - name: Install cargo-machete and cargo-deny
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-machete@0.9.2,cargo-deny@0.20.2
      # Built outside the repo so the PR's .cargo/config can't reach it.
      - name: Build the comment budget checker
        working-directory: ${{ env.RG }}/rust/comment-budget
        run: cargo build --release --locked --target-dir "$RUNNER_TEMP/cb-target"
      # A bad config (an alias over fmt, a rustc wrapper) could run PR code in the cargo steps below, so they need this to pass.
      - name: Cargo config
        id: cargo-config
        run: git ls-files -z -- ':(glob)**/.cargo/config' ':(glob)**/.cargo/config.toml' | xargs -0 python3 -I "$RG/rust/judge/judge.py" cargo-config
      - name: Format
        if: ${{ !cancelled() && steps.cargo-config.outcome == 'success' }}
        run: cargo fmt --all --check -- --config-path "$RG/rust/rustfmt.toml"
      - name: Comment budget
        if: ${{ !cancelled() }}
        run: '"$RUNNER_TEMP/cb-target/release/comment-budget" --base "$BASE_REF" --config "$RG/rust/comment-budget.toml"'
      - name: Unused dependencies
        if: ${{ !cancelled() && steps.cargo-config.outcome == 'success' }}
        run: cargo machete
      - name: Dependency rules
        if: ${{ !cancelled() && steps.cargo-config.outcome == 'success' }}
        env:
          ALLOWLIST: ${{ inputs.deny-allowlist }}
        run: |
          uv run --no-config --no-project --python 3.12 "$RG/rust/deny-merge/deny_merge.py" "$RG/rust/deny.toml" "$ALLOWLIST" "$RUNNER_TEMP/deny.toml"
          cargo deny --locked --config "$RUNNER_TEMP/deny.toml" check

  build:
    name: Rust build
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 30
    env:
      RG: ${{ github.workspace }}/repo-guards/ci-checks
      CARGO_BUILD_RUSTC_WRAPPER: ""
      CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER: ""
      RUSTC_WRAPPER: ""
      RUSTC_WORKSPACE_WRAPPER: ""
      CARGO_ENCODED_RUSTFLAGS: -Dwarnings
    defaults:
      run:
        shell: bash
        working-directory: repo
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false
      - *checkout-repo-guards
      - *install-rust
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: repo
          save-if: ${{ github.event_name == 'push' }}
      # From here on PR code runs (build scripts, proc macros); these steps only write results for the judge job.
      - name: Type check and dead code
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          cargo check --workspace --all-features --locked --message-format=json > "$RUNNER_TEMP/results/check.json" || true
      - name: Lint
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --all-features --locked --message-format=json -- -D warnings > "$RUNNER_TEMP/results/clippy.json" || true
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-results
          path: ${{ runner.temp }}/results/
          if-no-files-found: error

  judge:
    name: Rust judge
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    env:
      RG: ${{ github.workspace }}/repo-guards/ci-checks
    defaults:
      run:
        shell: bash
    steps:
      - *checkout-repo-guards
      - name: Download results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-results
          path: ${{ runner.temp }}/results
      - name: Type check and dead code
        if: ${{ !cancelled() }}
        run: python3 -I "$RG/rust/judge/judge.py" cargo "$RUNNER_TEMP/results/check.json"
      - name: Lint
        if: ${{ !cancelled() }}
        run: python3 -I "$RG/rust/judge/judge.py" cargo "$RUNNER_TEMP/results/clippy.json"

name: Duplication check

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner labels as JSON, e.g. '"ubuntu-latest"' or '["self-hosted","linux"]'
        type: string
        default: '"ubuntu-latest"'

permissions:
  contents: read

jobs:
  jscpd:
    name: Duplication
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 20
    env:
      RG: ${{ github.workspace }}/repo-guards/ci-checks
      GOTOOLCHAIN: local
      # uv runs inside the caller checkout: never read its uv.toml or pyproject.toml [tool.uv].
      UV_NO_CONFIG: "1"
    defaults:
      run:
        shell: bash
        working-directory: repo
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false
      # job.workflow_* is this file's repo and commit; the toJSON round trip hides it from actionlint 1.7.12, which lacks it.
      - name: Check out repo-guards at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          path: repo-guards
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      - name: Apply caller overrides
        run: uv run --no-project --python 3.12 "$RG/config-overrides/config_overrides.py" apply "$GITHUB_WORKSPACE/repo-guards" "$GITHUB_WORKSPACE/repo/.github/checks/repo-guards.toml"
      # jscpd:ignore-start is a comment in any of the four languages: each language's scanner finds its own.
      - name: Find languages
        id: languages
        run: uv run --no-project --python 3.14 "$RG/inline-exemptions/inline_exemptions.py" languages >> "$GITHUB_OUTPUT"
      - name: Install Rust
        if: steps.languages.outputs.rust == 'true'
        run: |
          toolchain=$(uv run --no-project --python 3.12 "$RG/config-overrides/config_overrides.py" get "$RG/rust/rust-toolchain.toml" toolchain channel)
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
            echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
            export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH"
          fi
          rustup toolchain install "$toolchain" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - name: Install Go
        if: steps.languages.outputs.go == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: repo-guards/ci-checks/go/.go-version
          cache: false
      - name: Install Node
        if: steps.languages.outputs.typescript == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          package-manager-cache: false
      - name: Inline exemptions
        run: uv run --no-project --python 3.14 "$RG/inline-exemptions/inline_exemptions.py" jscpd
      - name: Install jscpd
        working-directory: ${{ runner.temp }}
        run: |
          uv venv --python 3.12 jscpd-venv
          uv pip install --python jscpd-venv/bin/python --require-hashes -r "$RG/jscpd-requirements.txt"
      - name: Duplication
        run: |
          "$RUNNER_TEMP/jscpd-venv/bin/jscpd" --config "$RG/.jscpd.json" --baseline .github/checks/jscpd-baseline.json .

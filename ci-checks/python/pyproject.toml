[dependency-groups]
dev = ["coverage[toml]==7.17.2", "deptry==0.25.1", "jscpd==5.4.3", "pyright==1.1.414", "pytest==9.2.0", "ruff==0.17.4", "vulture==2.16"]

[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "lf"

[tool.pyright]
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.vulture]
paths = ["src"]
exclude = ["tests/", "*/test_*.py", "*_test.py"]
min_confidence = 60

[tool.coverage.run]
branch = true
relative_files = true
omit = ["**/tests/**", "**/test_*.py", "**/*_test.py", "**/conftest.py", "**/*_pb2.py", "**/*_pb2_grpc.py"]

[package]
name = "api-snapshot"
version = "0.1.0"
edition = "2024"
publish = false

# Its own workspace, so a caller's [workspace] above .repo-guards/ does not claim it.
[workspace]

[dependencies]
# Exact: each rustdoc-types release reads one rustdoc JSON format, the one the nightly in ../api-snapshot.toml emits.
rustdoc-types = "=0.61.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
